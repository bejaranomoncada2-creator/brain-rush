<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Brain Rush</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#03050d;
  color:#eef5ff;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button{
  font:inherit;
}

body{
  background:
    radial-gradient(
      circle at 50% 15%,
      rgba(0,210,255,.12),
      transparent 30%
    ),
    radial-gradient(
      circle at 15% 80%,
      rgba(112,65,255,.10),
      transparent 28%
    ),
    #03050d;
}

.app{
  height:100dvh;
  max-width:560px;
  margin:auto;
  padding:16px;
  position:relative;
}

.screen{
  height:100%;
  display:none;
  flex-direction:column;
}

.screen.active{
  display:flex;
}


/* =========================
   HOME
========================= */

.home{
  justify-content:center;
  gap:18px;
}

.logo{
  text-align:center;
  margin-bottom:6px;
}

.brain{
  font-size:58px;
  line-height:1;
  filter:
    drop-shadow(0 0 18px rgba(35,230,255,.65));
  animation:float 2.8s ease-in-out infinite;
}

h1{
  margin:5px 0 0;
  font-size:38px;
  letter-spacing:5px;
  line-height:1;
  text-shadow:
    0 0 22px rgba(35,230,255,.55);
}

.tag{
  margin-top:9px;
  color:#8190b4;
  font-size:11px;
  letter-spacing:3px;
}

.mode-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.mode{
  position:relative;
  text-align:left;
  padding:18px;
  border-radius:20px;
  border:1px solid rgba(100,130,190,.22);
  background:
    linear-gradient(
      145deg,
      rgba(15,24,48,.92),
      rgba(6,10,23,.92)
    );
  color:#eaf3ff;
  box-shadow:
    inset 0 0 25px rgba(50,80,150,.05),
    0 10px 30px rgba(0,0,0,.2);
  transition:
    transform .14s ease,
    box-shadow .14s ease,
    border-color .14s ease;
}

.mode:active{
  transform:scale(.97);
}

.mode.active{
  border-color:#22e7ff;
  box-shadow:
    0 0 22px rgba(34,231,255,.16),
    inset 0 0 25px rgba(34,231,255,.06);
}

.mode.locked{
  opacity:.38;
}

.mode-icon{
  font-size:25px;
}

.mode-name{
  font-weight:800;
  letter-spacing:1.2px;
  margin-top:9px;
}

.mode-sub{
  font-size:10px;
  color:#7f8eae;
  margin-top:4px;
}

.badge{
  position:absolute;
  right:10px;
  top:10px;
  font-size:9px;
  color:#6e7c9b;
}

.start{
  border:0;
  border-radius:18px;
  padding:17px 20px;

  background:
    linear-gradient(
      90deg,
      #17dfff,
      #6b63ff
    );

  color:#03101b;
  font-weight:950;
  letter-spacing:2px;

  box-shadow:
    0 0 30px rgba(36,220,255,.22);

  font-size:15px;
}

.start:active{
  transform:scale(.98);
}

.home-note{
  text-align:center;
  color:#647293;
  font-size:10px;
  letter-spacing:1px;
}


/* =========================
   GAME
========================= */

.game{
  gap:10px;
}

.topbar{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}

.stat{
  padding:9px 7px;
  border:1px solid rgba(100,130,190,.2);
  border-radius:14px;
  background:rgba(8,13,29,.78);
  text-align:center;
}

.stat small{
  display:block;
  color:#647394;
  font-size:8px;
  letter-spacing:1.4px;
}

.stat strong{
  font-size:17px;
}

.stat.combo strong{
  color:#27e6ff;
  text-shadow:
    0 0 12px rgba(39,230,255,.55);
}

.level-line{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 3px;
}

.level-title{
  font-weight:900;
  font-size:12px;
  letter-spacing:1.3px;
}

.level-count{
  color:#7381a1;
  font-size:10px;
}

.progress{
  height:4px;
  border-radius:5px;
  background:#0d1427;
  overflow:hidden;
}

.progress>i{
  display:block;
  height:100%;
  width:0;

  background:
    linear-gradient(
      90deg,
      #21e6ff,
      #7569ff
    );

  box-shadow:
    0 0 10px #21e6ff;

  transition:
    width .25s ease;
}


/* =========================
   ARENA
========================= */

#arena{
  position:relative;
  flex:1;
  min-height:0;

  margin-top:2px;

  border:1px solid rgba(75,130,255,.35);
  border-radius:25px;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 50%,
      rgba(25,50,130,.16),
      transparent 62%
    ),
    rgba(2,5,18,.86);

  box-shadow:
    inset 0 0 70px rgba(30,70,150,.10),
    0 0 30px rgba(50,70,255,.08);
}

#arena:before{
  content:"";
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      rgba(50,100,255,.04) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(50,100,255,.04) 1px,
      transparent 1px
    );

  background-size:34px 34px;

  pointer-events:none;
}


/*
  Protected instruction zone.
  Targets are never allowed to spawn here.
*/

.safe-zone{
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:105px;

  pointer-events:none;

  z-index:5;
}


/* =========================
   INSTRUCTIONS
========================= */

#message{
  position:absolute;

  top:12px;
  left:12px;

  width:calc(100% - 24px);

  min-height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:8px 12px;

  border-radius:13px;

  text-align:center;

  color:#c7d3ee;

  font-size:10px;
  letter-spacing:1.25px;
  line-height:1.25;

  background:
    rgba(3,5,16,.84);

  border:
    1px solid rgba(36,232,255,.13);

  backdrop-filter:blur(8px);

  z-index:50;

  pointer-events:none;
}


/* =========================
   TARGETS
========================= */

.target{
  position:absolute;

  border:0;
  border-radius:50%;

  cursor:pointer;

  z-index:20;

  transform:
    translate(-50%,-50%)
    scale(1);

  box-shadow:
    0 0 12px currentColor,
    0 0 30px currentColor,
    inset 0 0 10px rgba(255,255,255,.45);

  transition:
    transform .08s ease,
    filter .08s ease;
}

.target:active{
  transform:
    translate(-50%,-50%)
    scale(.88);
}

.blue{
  background:#27dfff;
  color:#27dfff;
}

.yellow{
  background:#ffe45c;
  color:#ffe45c;
}

.green{
  background:#52f59b;
  color:#52f59b;
}

.red{
  background:#ff5575;
  color:#ff5575;
}

.purple{
  background:#a875ff;
  color:#a875ff;
}

.target:after{
  content:"";

  position:absolute;
  inset:23%;

  border-radius:50%;

  background:
    rgba(255,255,255,.28);
}

.pulse{
  animation:
    pulse .65s ease-out infinite;
}


/* =========================
   FEEDBACK
========================= */

.flash{
  position:absolute;
  inset:0;

  pointer-events:none;

  z-index:100;

  background:
    rgba(255,255,255,.13);

  animation:
    flash .18s ease-out forwards;
}

.float-text{
  position:absolute;

  z-index:120;

  pointer-events:none;

  font-size:16px;
  font-weight:950;
  letter-spacing:1px;

  color:#dffaff;

  text-shadow:
    0 0 15px currentColor;

  animation:
    floatText .55s ease-out forwards;
}

.particle{
  position:absolute;

  width:6px;
  height:6px;

  border-radius:50%;

  z-index:110;

  pointer-events:none;

  box-shadow:
    0 0 10px currentColor;

  animation:
    particle .55s ease-out forwards;
}


/* =========================
   BUTTONS
========================= */

.footer-actions{
  display:flex;
  gap:8px;
}

.secondary{
  flex:1;

  border:
    1px solid rgba(100,130,190,.22);

  background:#080d1d;

  color:#93a1bf;

  border-radius:13px;

  padding:10px;

  font-size:10px;
  letter-spacing:1px;
}


/* =========================
   END SCREEN
========================= */

.overlay{
  position:absolute;
  inset:0;

  z-index:200;

  display:none;

  align-items:center;
  justify-content:center;

  background:
    rgba(1,3,10,.72);

  backdrop-filter:blur(8px);

  padding:24px;
}

.overlay.show{
  display:flex;
}

.panel{
  text-align:center;
  width:100%;

  padding:28px;

  border-radius:25px;

  border:
    1px solid rgba(39,230,255,.24);

  background:
    linear-gradient(
      145deg,
      rgba(12,19,42,.97),
      rgba(4,8,19,.97)
    );

  box-shadow:
    0 0 50px rgba(20,190,255,.12);
}

.panel h2{
  margin:0;

  font-size:29px;

  letter-spacing:3px;
}

.panel p{
  color:#8390ad;

  font-size:12px;

  line-height:1.5;
}

.big-score{
  font-size:45px;

  font-weight:950;

  margin:12px 0;

  text-shadow:
    0 0 20px rgba(39,230,255,.4);
}


/* =========================
   ANIMATIONS
========================= */

@keyframes pulse{

  50%{
    transform:
      translate(-50%,-50%)
      scale(1.08);

    filter:
      brightness(1.25);
  }

}

@keyframes flash{

  to{
    opacity:0;
  }

}

@keyframes floatText{

  to{
    opacity:0;

    transform:
      translateY(-35px)
      scale(1.08);
  }

}

@keyframes particle{

  to{
    opacity:0;

    transform:
      translate(
        var(--dx),
        var(--dy)
      )
      scale(.2);
  }

}

@keyframes float{

  50%{
    transform:
      translateY(-5px);
  }

}


/* =========================
   SMALL SCREENS
========================= */

@media(max-height:680px){

  .app{
    padding:10px;
  }

  .brain{
    font-size:42px;
  }

  h1{
    font-size:31px;
  }

  .mode{
    padding:13px;
  }

  .home{
    gap:11px;
  }

  .mode-sub{
    display:none;
  }

}
</style>
</head>

<body>

<div class="app">

<!-- =========================
     HOME
========================= -->

<section

>

  <div class="logo">

    <div class="brain">

    </div>

    <button

    >

    >

  <div class="topbar">

<script>

/* =====================================================
   BRAIN RUSH
   SPEED MODE
===================================================== */


/* =========================
   BASIC HELPERS
========================= */

const $ =
  id => document.getElementById(id);


const colours =
  [
    "blue",
    "yellow",
    "green",
    "red"
  ];


const TOTAL =
  30;


let level =
  1;

let score =
  0;

let combo =
  0;

let lives =
  3;

let best =
  Number(
    localStorage.getItem(
      "brainRushBest"
    ) || 0
  );


let timer =
  null;

let sequenceTimer =
  null;

let levelStarted =
  0;

let sequenceStep =
  0;

let currentTargets =
  [];

let audioCtx =
  null;


/* =========================
   HUD
========================= */

function updateHUD(){

  $("score").textContent =
    Math.round(score).toLocaleString();


  $("combo").textContent =
    "x" + combo;


  $("lives").textContent =
    "♥".repeat(lives) +
    "♡".repeat(3 - lives);


  $("levelCount").textContent =
    level +
    " / " +
    TOTAL;


  $("progress").style.width =
    (
      (level - 1) /
      TOTAL *
      100
    ) + "%";

}


function setMessage(text){

  $("message").textContent =
    text;

}


/* =========================
   TIMER CONTROL
========================= */

function clearTimers(){

  clearTimeout(timer);

  clearTimeout(sequenceTimer);

  timer =
    null;

  sequenceTimer =
    null;

}


/* =========================
   TARGET CLEANUP
========================= */

function clearTargets(){

  document
    .querySelectorAll(".target")
    .forEach(
      element =>
        element.remove()
    );

  currentTargets =
    [];

}


/* =========================
   SOUND
========================= */

function sound(
  frequency = 500,
  duration = .045,
  type = "sine"
){

  try{

    audioCtx ||=
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    const oscillator =
      audioCtx.createOscillator();


    const gain =
      audioCtx.createGain();


    oscillator.type =
      type;


    oscillator.frequency.value =
      frequency;


    gain.gain.setValueAtTime(
      .045,
      audioCtx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioCtx.currentTime +
      duration
    );


    oscillator.connect(gain);

    gain.connect(
      audioCtx.destination
    );


    oscillator.start();


    oscillator.stop(
      audioCtx.currentTime +
      duration
    );

  }

  catch(error){

    /* Audio is optional. */

  }

}


/* =========================
   PARTICLE EFFECT
========================= */

function burst(
  x,
  y,
  colour
){

  const arena =
    $("arena");


  for(
    let i = 0;
    i < 12;
    i++
  ){

    const particle =
      document.createElement("i");


    particle.className =
      "particle " +
      colour;


    particle.style.left =
      x + "px";


    particle.style.top =
      y + "px";


    const angle =
      Math.random() *
      Math.PI *
      2;


    const distance =
      25 +
      Math.random() *
      55;


    particle.style.setProperty(
      "--dx",
      Math.cos(angle) *
      distance +
      "px"
    );


    particle.style.setProperty(
      "--dy",
      Math.sin(angle) *
      distance +
      "px"
    );


    arena.appendChild(
      particle
    );


    setTimeout(
      () =>
        particle.remove(),
      600
    );

  }


  const text =
    document.createElement("div");


  text.className =
    "float-text";


  const points =
    pointsForHit();


  text.textContent =
    combo >= 8
      ? "PERFECT +" + points
      : "+" + points;


  text.style.left =
    x + "px";


  text.style.top =
    y + "px";


  arena.appendChild(
    text
  );


  setTimeout(
    () =>
      text.remove(),
    600
  );

}


/* =========================
   SCREEN FLASH
========================= */

function flash(){

  const element =
    document.createElement("div");


  element.className =
    "flash";


  $("arena")
    .appendChild(
      element
    );


  setTimeout(
    () =>
      element.remove(),
    190
  );

}


/* =========================
   SCORING
========================= */

function pointsForHit(){

  return Math.round(
    80 +
    combo * 12 +
    level * 4
  );

}


/* =========================
   SUCCESS
========================= */

function hitSuccess(
  button
){

  if(
    !button.isConnected
  ){

    return;

  }


  const rect =
    button.getBoundingClientRect();


  const arenaRect =
    $("arena")
      .getBoundingClientRect();


  const x =
    rect.left -
    arenaRect.left +
    rect.width / 2;


  const y =
    rect.top -
    arenaRect.top +
    rect.height / 2;


  combo++;


  score +=
    pointsForHit();


  burst(
    x,
    y,
    button.classList.contains("yellow")
      ? "yellow"
      : button.classList.contains("red")
        ? "red"
        : button.classList.contains("green")
          ? "green"
          : "blue"
  );


  sound(
    520 +
    Math.min(combo,12) *
    38,
    .055,
    "triangle"
  );


  flash();


  if(
    combo === 3 ||
    combo === 5 ||
    combo === 8 ||
    combo === 12
  ){

    sound(
      850,
      .09,
      "square"
    );

  }

}


/* =========================
   FAIL
========================= */

function failLevel(
  reason
){

  if(
    !timer &&
    !sequenceTimer &&
    levelStarted === 0
  ){

    return;

  }


  clearTimers();

  clearTargets();


  levelStarted =
    0;


  combo =
    0;


  lives--;


  updateHUD();


  sound(
    130,
    .16,
    "sawtooth"
  );


  flash();


  if(
    lives <= 0
  ){

    finish(false);

    return;

  }


  setMessage(
    reason +
    "  •  LIFE LOST"
  );


  timer =
    setTimeout(
      () =>
        startLevel(),
      430
    );

}


/* =========================
   START RUN
========================= */

function startRun(){

  clearTimers();

  clearTargets();


  level =
    1;


  score =
    0;


  combo =
    0;


  lives =
    3;


  $("home")
    .classList
    .remove("active");


  $("game")
    .classList
    .add("active");


  updateHUD();


  countdown(
    () =>
      startLevel()
  );

}


/* =========================
   COUNTDOWN
========================= */

function countdown(
  done
){

  clearTargets();


  let number =
    3;


  setMessage(
    number
  );


  const tick =
    () => {

      if(
        number === 0
      ){

        setMessage(
          "GO!"
        );


        sound(
          700,
          .08,
          "square"
        );


        setTimeout(
          done,
          120
        );


        return;

      }


      setMessage(
        number
      );


      sound(
        300 +
        number * 90,
        .07,
        "square"
      );


      number--;


      setTimeout(
        tick,
        300
      );

    };


  tick();

}


/* =========================
   LEVEL TYPE
========================= */

function levelType(
  currentLevel
){

  if(
    currentLevel <= 2
  ){

    return "reaction";

  }


  if(
    currentLevel <= 5
  ){

    return "rapid";

  }


  if(
    currentLevel <= 8
  ){

    return "avoid";

  }


  if(
    currentLevel <= 12
  ){

    return "moving";

  }


  if(
    currentLevel <= 17
  ){

    return "sequence";

  }


  if(
    currentLevel <= 22
  ){

    return "precision";

  }


  if(
    currentLevel <= 26
  ){

    return "rapid";

  }


  return "sequence";

}


/* =========================
   LEVEL NAME
========================= */

function levelName(
  currentLevel
){

  const type =
    levelType(
      currentLevel
    );


  return {

    reaction:
      "REACTION",

    rapid:
      "RAPID FIRE",

    avoid:
      "DON'T TAP",

    moving:
      "MOVING TARGET",

    sequence:
      "COLOUR SEQUENCE",

    precision:
      "PRECISION"

  }[type];

}


/* =========================
   START LEVEL
========================= */

function startLevel(){

  clearTimers();

  clearTargets();


  $("levelTitle")
    .textContent =
    levelName(level);

updateHUD();

/*
 * READING PHASE
 * Give the player 2 full seconds
 * to read the instruction.
 *
 * IMPORTANT:
 * - No target appears yet
 * - Challenge timer has not started
 * - No life can be lost
 */

timer =
    setTimeout(
        () => {

            /*
             * The actual challenge starts
             * only after the reading period.
             */
            levelStarted =
                performance.now();

            const type =
                levelType(level);

            if(
                type === "reaction"
            ){

                reaction();

            }

            else if(
                type === "rapid"
            ){

                rapid();

            }

            else if(
                type === "avoid"
            ){

                avoid();

            }

            else if(
                type === "moving"
            ){

                moving();

            }

            else if(
                type === "sequence"
            ){

                sequence();

            }

            else{

                precision();

            }

        },
        2000
    );

}

/* =========================
   ARENA SIZE
========================= */

function arenaSize(){

  return $("arena")
    .getBoundingClientRect();

}


/* =========================
   COLLISION CHECK
========================= */

function positionClear(
  x,
  y,
  size
){

  const targets =
    [
      ...document
        .querySelectorAll(
          ".target"
        )
    ];


  for(
    const target of targets
  ){

    const targetRect =
      target.getBoundingClientRect();


    const arenaRect =
      $("arena")
        .getBoundingClientRect();


    const targetX =
      targetRect.left -
      arenaRect.left +
      targetRect.width / 2;


    const targetY =
      targetRect.top -
      arenaRect.top +
      targetRect.height / 2;


    const distance =
      Math.hypot(
        x - targetX,
        y - targetY
      );


    if(
      distance <
      size / 2 +
      targetRect.width / 2 +
      12
    ){

      return false;

    }

  }


  return true;

}


/* =========================
   SAFE RANDOM POSITION
========================= */

function randomPosition(
  size = 60
){

  const arena =
    arenaSize();


  const margin =
    Math.max(
      34,
      size / 2 + 10
    );


  /*
    The instruction area occupies
    the top portion of the arena.

    Targets begin below it.
  */

  const safeTop =
    Math.max(
      104,
      Math.min(
        arena.height * .22,
        145
      )
    );


  const minimumY =
    Math.min(
      safeTop,
      arena.height -
      margin -
      10
    );


  /*
    Try many positions so targets
    don't overlap each other.
  */

  for(
    let attempt = 0;
    attempt < 90;
    attempt++
  ){

    const x =
      margin +
      Math.random() *
      Math.max(
        1,
        arena.width -
        margin * 2
      );


    const y =
      minimumY +
      Math.random() *
      Math.max(
        1,
        arena.height -
        margin -
        minimumY
      );


    if(
      positionClear(
        x,
        y,
        size
      )
    ){

      return {
        x,
        y
      };

    }

  }


  /*
    Fallback position.
  */

  return {

    x:
      arena.width / 2,

    y:
      Math.max(
        minimumY,
        arena.height / 2
      )

  };

}


/* =========================
   CREATE TARGET
========================= */

function makeTarget({

  colour = "blue",

  size = 60,

  correct = true,

  onClick = null,

  pulse = false

} = {}){


  const button =
    document.createElement(
      "button"
    );


  button.type =
    "button";


  button.className =
    "target " +
    colour;


  button.style.width =
    size + "px";


  button.style.height =
    size + "px";


  const position =
    randomPosition(
      size
    );


  button.style.left =
    position.x + "px";


  button.style.top =
    position.y + "px";


  if(
    pulse
  ){

    button.classList.add(
      "pulse"
    );

  }


  button.onclick =
    event => {

      event.stopPropagation();


      if(
        onClick
      ){

        onClick(
          button,
          correct
        );

      }

    };


  $("arena")
    .appendChild(
      button
    );


  currentTargets.push(
    button
  );


  return button;

}


/* =========================
   NEXT LEVEL
========================= */

function nextLevel(){

  clearTimers();

  clearTargets();


  levelStarted =
    0;


  if(
    level >= TOTAL
  ){

    finish(true);

    return;

  }


  level++;


  updateHUD();


  /*
    Very short transition.
    The game keeps momentum.
  */

  timer =
    setTimeout(
      () =>
        startLevel(),
      220
    );

}


/* =========================
   REGISTER CORRECT HIT
========================= */

function registerCorrect(
  button
){

  if(
    !button.isConnected
  ){

    return;

  }


  hitSuccess(
    button
  );


  clearTimers();


  /*
    Faster players receive
    an additional time bonus.
  */

  const elapsed =
    performance.now() -
    levelStarted;


  const bonus =
    Math.max(
      0,
      Math.round(
        180 -
        elapsed / 8
      )
    );


  score +=
    bonus;


  if(
    combo >= 5
  ){

    score +=
      50;

  }


  nextLevel();

}


/* =====================================================
   LEVEL TYPE 1 — REACTION
===================================================== */

function reaction(){

  setMessage(
    "TAP THE GLOWING TARGET"
  );


  /*
    Reaction delay gets shorter.
  */

  const delay =
    Math.max(
      120,
      550 -
      level * 12
    );


  timer =
    setTimeout(
      () => {

        const size =
          Math.max(
            42,
            76 -
            level
          );


        const colour =
          colours[
            Math.floor(
              Math.random() *
              colours.length
            )
          ];


        makeTarget({

          size,

          colour,

          pulse:true,

          onClick:
            button =>
              registerCorrect(
                button
              )

        });


        timer =
          setTimeout(
            () =>
              failLevel(
                "TOO SLOW!"
              ),

            Math.max(
              700,
              1550 -
              level * 22
            )

          );

      },

      delay
    );

}


/* =====================================================
   LEVEL TYPE 2 — RAPID FIRE
===================================================== */

function rapid(){

  const total =
    level < 7
      ? 3
      : level < 20
        ? 4
        : 5;


  let hits =
    0;


  setMessage(
    "RAPID FIRE  •  " +
    total +
    " TARGETS"
  );


  const spawn =
    () => {

      if(
        hits >= total
      ){

        clearTimers();

        nextLevel();

        return;

      }


      const size =
        Math.max(
          36,
          62 -
          level * .65
        );


      makeTarget({

        size,

        colour:
          colours[
            (hits + level) %
            4
          ],

        onClick:
          button => {

            hitSuccess(
              button
            );


            hits++;


            clearTimeout(
              timer
            );


            if(
              hits >= total
            ){

              nextLevel();

            }

            else{

              spawn();

            }

          }

      });


      timer =
        setTimeout(
          () =>
            failLevel(
              "KEEP MOVING!"
            ),

          Math.max(
            520,
            1050 -
            level * 15
          )

        );

    };


  spawn();

}


/* =====================================================
   LEVEL TYPE 3 — DON'T TAP
===================================================== */

function avoid(){

  const bad =
    level % 2
      ? "red"
      : "yellow";


  setMessage(
    "TAP ANYTHING EXCEPT " +
    bad.toUpperCase()
  );


  const total =
    3 +
    Math.floor(
      level / 3
    );


  let hits =
    0;


  for(
    let i = 0;
    i < total;
    i++
  ){

    const colour =
      Math.random() < .32
        ? bad
        : colours.filter(
            item =>
              item !== bad
          )[
            Math.floor(
              Math.random() * 3
            )
          ];


    makeTarget({

      size:
        Math.max(
          38,
          64 -
          level * .5
        ),

      colour,

      onClick:
        button => {

          if(
            colour === bad
          ){

            failLevel(
              "TRAP!"
            );

            return;

          }


          hitSuccess(
            button
          );


          hits++;


          if(
            hits >= total
          ){

            nextLevel();

          }

        }

    });

  }


  timer =
    setTimeout(
      () =>
        failLevel(
          "TOO SLOW!"
        ),

      Math.max(
        1200,
        2300 -
        level * 28
      )

    );

}


/* =====================================================
   LEVEL TYPE 4 — MOVING TARGET
===================================================== */

function moving(){

  setMessage(
    "HIT IT BEFORE IT MOVES"
  );


  const size =
    Math.max(
      40,
      70 -
      level * .9
    );


  const target =
    makeTarget({

      size,

      colour:"blue",

      pulse:true,

      onClick:
        button =>
          registerCorrect(
            button
          )

    });


  let moves =
    0;


  const move =
    () => {

      if(
        !target.isConnected
      ){

        return;

      }


      moves++;


      const position =
        randomPosition(
          size
        );


      target.style.left =
        position.x + "px";


      target.style.top =
        position.y + "px";


      if(
        moves < 3
      ){

        timer =
          setTimeout(
            move,

            Math.max(
              260,
              520 -
              level * 6
            )

          );

      }

    };


  timer =
    setTimeout(
      move,

      Math.max(
        320,
        700 -
        level * 7
      )

    );


  sequenceTimer =
    setTimeout(
      () =>
        failLevel(
          "TOO SLOW!"
        ),

      Math.max(
        1000,
        1700 -
        level * 20
      )

    );

}


/* =====================================================
   RANDOM SEQUENCE
===================================================== */

function getSequence(){

  const pool =
    [
      ...colours
    ];


  const sequence =
    [];


  const length =
    4;


  while(
    sequence.length <
    length
  ){

    const index =
      Math.floor(
        Math.random() *
        pool.length
      );


    sequence.push(
      pool.splice(
        index,
        1
      )[0]
    );

  }


  return sequence;

}


/* =====================================================
   LEVEL TYPE 5 — COLOUR SEQUENCE
===================================================== */

function sequence(){

  sequenceStep =
    0;


  const sequence =
    getSequence();


  /*
    Short memory phase.
  */

  setMessage(
    "MEMORISE: " +
    sequence
      .map(
        colour =>
          colour.toUpperCase()
      )
      .join(" → ")
  );


  timer =
    setTimeout(
      () =>
        sequenceRound(
          sequence
        ),

      650
    );

}


function sequenceRound(
  sequence
){

  clearTargets();


  const correct =
    sequence[
      sequenceStep
    ];


  const size =
    Math.max(
      38,
      62 -
      level * .65
    );


  /*
    Instruction stays protected.
  */

  setMessage(
    "NOW: " +
    correct.toUpperCase() +
    "  •  " +
    (sequenceStep + 1) +
    "/" +
    sequence.length
  );


  colours.forEach(
    colour => {

      makeTarget({

        colour,

        size,

        correct:
          colour === correct,

        onClick:
          (
            button,
            isCorrect
          ) => {

            clearTimeout(
              sequenceTimer
            );


            if(
              !isCorrect
            ){

              failLevel(
                "WRONG COLOUR!"
              );

              return;

            }


            hitSuccess(
              button
            );


            sequenceStep++;


            if(
              sequenceStep >=
              sequence.length
            ){

              nextLevel();

              return;

            }


            /*
              Immediate next step.
              No unnecessary pause.
            */

            sequenceRound(
              sequence
            );

          }

      });

    }
  );


  sequenceTimer =
    setTimeout(
      () =>
        failLevel(
          "TOO SLOW!"
        ),

      Math.max(
        650,
        1350 -
        level * 18 -
        sequenceStep * 80
      )

    );

}


/* =====================================================
   LEVEL TYPE 6 — PRECISION
===================================================== */

function precision(){

  setMessage(
    level % 2
      ? "HIT THE SMALL TARGET"
      : "WAIT FOR THE PERFECT MOMENT"
  );


  const size =
    Math.max(
      28,
      52 -
      level * .7
    );


  const delay =
    level % 2
      ? 0
      : Math.max(
          250,
          850 -
          level * 18
        );


  timer =
    setTimeout(
      () => {

        makeTarget({

          size,

          colour:"purple",

          pulse:true,

          onClick:
            button =>
              registerCorrect(
                button
              )

        });


        timer =
          setTimeout(
            () =>
              failLevel(
                "MISSED THE WINDOW!"
              ),

            Math.max(
              650,
              1200 -
              level * 15
            )

          );

      },

      delay
    );

}


/* =====================================================
   FINISH
===================================================== */

function finish(
  won
){

  clearTimers();

  clearTargets();


  best =
    Math.max(
      best,
      score
    );


  localStorage.setItem(
    "brainRushBest",
    best
  );


  $("panelTitle")
    .textContent =
      won
        ? "RUN COMPLETE"
        : "GAME OVER";


  $("finalScore")
    .textContent =
      Math.round(
        score
      ).toLocaleString();


  $("panelText")
    .textContent =
      won
        ? "30 levels cleared. Best: " +
          Math.round(best).toLocaleString()
        : "Out of lives. Best: " +
          Math.round(best).toLocaleString();


  $("overlay")
    .classList
    .add("show");

}


/* =====================================================
   BUTTONS
===================================================== */

$("startBtn").onclick =
  startRun;
$("speedMode").onclick = startRun;

$("againBtn").onclick =
  () => {

    $("overlay")
      .classList
      .remove("show");


    startRun();

  };


$("homeBtn").onclick =
  () => {

    clearTimers();

    clearTargets();


    $("overlay")
      .classList
      .remove("show");


    $("game")
      .classList
      .remove("active");


    $("home")
      .classList
      .add("active");

  };


</script>
