<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#03040d">
<title>Brain Rush</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  min-height:100%;
  background:#03040d;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow-x:hidden
}

button{font:inherit}

#app{
  min-height:100vh;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 5%,#29358c66,transparent 35%),
    radial-gradient(circle at 0 80%,#8c18ff18,transparent 38%),
    radial-gradient(circle at 100% 75%,#00ffe018,transparent 35%),
    #03040d
}

#app:before{
  content:"";
  position:absolute;
  left:-25%;
  right:-25%;
  top:35%;
  bottom:-20%;
  background-image:
    linear-gradient(#5474ff13 1px,transparent 1px),
    linear-gradient(90deg,#5474ff13 1px,transparent 1px);
  background-size:42px 42px;
  transform:perspective(650px) rotateX(58deg) scale(1.7);
  transform-origin:center bottom;
  pointer-events:none
}

.screen{
  display:none;
  position:relative;
  z-index:2;
  min-height:100vh;
  padding:30px 16px 45px
}

.screen.active{display:block}

.wrap{
  width:min(860px,100%);
  margin:auto;
  text-align:center
}

.logo{
  font-size:clamp(43px,11vw,78px);
  font-weight:1000;
  font-style:italic;
  letter-spacing:-4px;
  line-height:.95;
  background:linear-gradient(90deg,#f5ffff,#54efff 52%,#ff32d7);
  -webkit-background-clip:text;
  color:transparent;
  filter:drop-shadow(0 0 12px #4defff77)
}

.tag{
  margin:14px 0 54px;
  color:#dfe0eb;
  font-size:11px;
  letter-spacing:6px
}

.choose{
  font-size:19px;
  letter-spacing:4px;
  margin-bottom:24px;
  font-weight:700
}

.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px
}

.card{
  --c:#2defff;
  min-height:165px;
  padding:22px 19px;
  border:1px solid #6873ff18;
  border-radius:26px;
  background:linear-gradient(145deg,#0d1433d9,#080b20d9);
  color:var(--c);
  text-align:left;
  cursor:pointer;
  transition:.16s
}

.card:active{transform:scale(.985)}

.card.selected{
  border-color:var(--c);
  box-shadow:
    0 0 18px #ffffff17,
    inset 0 0 30px #ffffff08
}

.ico{
  font-size:38px;
  margin-bottom:20px;
  text-shadow:0 0 18px currentColor
}

.nm{
  font-size:18px;
  font-weight:900;
  letter-spacing:1px
}

.ds{
  margin-top:9px;
  color:#858aa3;
  font-size:12px;
  line-height:1.4
}

.st{
  float:right;
  font-size:9px;
  letter-spacing:1px
}

.memory{--c:#b747ff}
.observation{--c:#3cff9d}
.precision{--c:#ffdf42}
.pattern{--c:#d75aff}
.trap{--c:#ff477d}

.start{
  width:100%;
  height:61px;
  margin-top:18px;
  border:0;
  border-radius:21px;
  background:linear-gradient(100deg,#54f4ff,#c8fbff 40%,#9850ff);
  color:#07101f;
  font-weight:1000;
  letter-spacing:4px;
  cursor:pointer;
  box-shadow:0 0 18px #54efff55
}

.foot{
  margin-top:18px;
  color:#858aa3;
  font-size:11px;
  letter-spacing:2px
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px
}

.stat{
  padding:10px;
  background:#080c20dd;
  border:1px solid #5262ff22;
  border-radius:14px
}

.lab{
  font-size:8px;
  letter-spacing:2px;
  color:#777c96
}

.val{
  font-size:19px;
  font-weight:900;
  margin-top:4px
}

.score{color:#50efff}
.streak{color:#ff4bd9}
.best{color:#ffe15a}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:11px 2px
}

.cat{
  font-weight:900;
  letter-spacing:2px
}

.lv{
  color:#858aa3;
  font-size:11px
}

.lives{
  display:flex;
  gap:5px
}

.life{
  width:12px;
  height:12px;
  border-radius:50%;
  background:#ff397d;
  box-shadow:0 0 9px #ff397d
}

.life.off{
  background:#292a3a;
  box-shadow:none
}

.instruction{
  min-height:88px;
  padding:14px;
  border:1px solid var(--c);
  border-radius:20px;
  background:#0b1230ee
}

.ih{
  font-size:9px;
  letter-spacing:3px;
  color:var(--c)
}

.im{
  font-size:clamp(17px,4vw,23px);
  font-weight:900;
  margin-top:7px
}

.is{
  font-size:10px;
  color:#8d92aa;
  letter-spacing:2px;
  margin-top:6px;
  min-height:12px
}

.arena{
  height:min(63vh,560px);
  min-height:410px;
  margin-top:13px;
  position:relative;
  overflow:hidden;
  border-radius:28px;
  border:1px solid #5564ff33;
  background:
    radial-gradient(circle,#18204d55,transparent 62%),
    #040616ee;
  touch-action:manipulation
}

.arena:before{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(#5474ff0b 1px,transparent 1px),
    linear-gradient(90deg,#5474ff0b 1px,transparent 1px);
  background-size:40px 40px;
  pointer-events:none
}

.arena.read:after{
  content:"READ";
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  font-size:44px;
  font-weight:1000;
  letter-spacing:7px;
  color:#62efff10;
  pointer-events:none
}

.target,.dot,.ring{
  position:absolute;
  transform:translate(-50%,-50%);
  cursor:pointer;
  z-index:4
}

.target{
  width:70px;
  height:70px;
  border-radius:50%;
  background:
    radial-gradient(
      circle,
      #fff 0 8%,
      #64f6ff 10% 24%,
      #00cfff 27% 44%,
      #00cfff33 46% 65%,
      transparent 68%
    );
  box-shadow:
    0 0 14px #52f4ff,
    0 0 35px #1eeaffaa;
  animation:pulse .7s infinite alternate
}

.target.small{
  width:50px;
  height:50px
}

.target.tiny{
  width:34px;
  height:34px
}

.target.red{
  background:
    radial-gradient(
      circle,
      #fff 0 8%,
      #ff639f 10% 25%,
      #ff145e 28% 45%,
      #ff145e33 48% 65%,
      transparent 68%
    );
  box-shadow:
    0 0 15px #ff377b,
    0 0 38px #ff1e6466
}

.dot{
  width:50px;
  height:50px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#111a42;
  border:2px solid var(--c);
  font-weight:900
}

.dot.big{
  width:66px;
  height:66px
}

.grid{
  position:absolute;
  inset:18px;
  display:grid;
  place-content:center;
  gap:8px
}

.cell{
  width:48px;
  height:48px;
  border-radius:11px;
  background:#0c1230;
  border:1px solid #6875ff33;
  display:grid;
  place-items:center;
  font-weight:900;
  cursor:pointer;
  color:#fff
}

.cell.hot{
  background:var(--c);
  color:#07101f;
  box-shadow:0 0 16px var(--c)
}

.cell.correct{
  background:#fff;
  color:#07101f
}

.sym{
  position:absolute;
  left:50%;
  top:43%;
  transform:translate(-50%,-50%);
  font-size:50px;
  color:var(--c);
  text-shadow:0 0 20px var(--c);
  font-weight:900
}

.ring{
  border:4px solid var(--c);
  border-radius:50%;
  box-shadow:0 0 24px #ffffff22
}

.feed{
  position:absolute;
  left:50%;
  top:50%;
  z-index:20;
  opacity:0;
  font-size:34px;
  font-weight:1000;
  pointer-events:none
}

.feed.show{
  animation:feed .6s ease-out
}

.good{
  color:#5dffbd;
  text-shadow:0 0 20px #5dffbd88
}

.bad{
  color:#ff4f88;
  text-shadow:0 0 20px #ff4f8888
}

@keyframes pulse{
  to{
    transform:translate(-50%,-50%) scale(1.08)
  }
}

@keyframes feed{
  20%{
    opacity:1
  }
  100%{
    opacity:0;
    transform:translate(-50%,-80%) scale(1.1)
  }
}

.quit{
  width:100%;
  height:47px;
  margin-top:12px;
  background:#0c0f28;
  border:1px solid #6670ff33;
  color:#bbbfd2;
  border-radius:14px;
  cursor:pointer
}

.count,.overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:80;
  background:#02030dcc;
  place-items:center;
  padding:20px
}

.count.active,.overlay.active{
  display:grid
}

.num{
  font-size:clamp(90px,28vw,210px);
  font-weight:1000;
  color:#fff;
  text-shadow:
    0 0 25px #4defff,
    0 0 70px #28dcff99
}

.panel{
  width:min(460px,100%);
  padding:30px 22px;
  text-align:center;
  border-radius:27px;
  border:1px solid var(--c);
  background:#0a1028f5
}

.et{
  font-size:30px;
  font-weight:1000
}

.es{
  color:#9297ad;
  margin:10px;
  line-height:1.5
}

.ev{
  font-size:46px;
  font-weight:1000;
  color:var(--c);
  margin:20px
}

.again,.homebtn{
  width:100%;
  height:53px;
  border-radius:17px;
  font-weight:900;
  cursor:pointer
}

.again{
  border:0;
  background:linear-gradient(100deg,#52efff,#9d50ff);
  color:#07101f
}

.homebtn{
  margin-top:10px;
  background:#101432;
  color:#bbbfd2;
  border:1px solid #6670ff33
}

@media(max-width:600px){
  .screen{
    padding:28px 16px 40px
  }

  .tag{
    margin-bottom:45px
  }

  .card{
    min-height:150px;
    padding:19px 16px;
    border-radius:23px
  }

  .ico{
    font-size:32px;
    margin-bottom:18px
  }

  .nm{
    font-size:17px
  }

  .arena{
    min-height:420px
  }
}
</style>
</head>

<body>

<div id="app">

<section id="home" class="screen active">
  <div class="wrap">

    <div class="logo">BRAIN RUSH</div>

    <div class="tag">
      THINK FAST. SEE FASTER.
    </div>

    <div class="choose">
      CHOOSE YOUR BATTLE
    </div>

    <div id="cards" class="cards"></div>

    <button id="start" class="start"></button>

    <div class="foot">
      6 CATEGORIES · 180 LEVELS · 3 LIVES
    </div>

  </div>
</section>


<section id="game" class="screen">
  <div class="wrap">

    <div class="stats">

      <div class="stat">
        <div class="lab">SCORE</div>
        <div id="score" class="val score">0</div>
      </div>

      <div class="stat">
        <div class="lab">STREAK</div>

      </div>

      <div class="stat">
        <div class="lab">BEST</div>
        <div id="best" class="val best">0</div>
      </div>

    </div>


    <div class="row">

      <div>
        <span id="cat" class="cat"></span>
        ·
        <span id="lv" class="lv"></span>
      </div>

      <div id="lives" class="lives"></div>

    </div>


    <div class="instruction">

      <div id="ih" class="ih"></div>

      <div id="im" class="im"></div>

      <div id="is" class="is"></div>

    </div>


    <div id="arena" class="arena">
      <div id="feed" class="feed"></div>
    </div>


    <button id="quit" class="quit">
      QUIT RUN
    </button>

  </div>
</section>


<div id="count" class="count">
  <div id="num" class="num">3</div>
</div>


<div id="overlay" class="overlay">

  <div class="panel">

    <div id="et" class="et"></div>

    <div id="es" class="es"></div>

    <div id="ev" class="ev">0</div>

    <button id="again" class="again">
      RUN AGAIN
    </button>

    <button id="homeBtn" class="homebtn">
      CHOOSE CATEGORY
    </button>

  </div>

</div>

</div>

/* =========================================================
   HOME / CATEGORY UI
========================================================= */

function select(c){

  G.cat=c;

  document
    .querySelectorAll('.card')
    .forEach(b=>{
      b.classList.toggle(
        'selected',
        b.dataset.cat===c
      );
    });

  $('start').textContent=
    INFO[c][1]+'  START '+INFO[c][0]+' RUN';
}


function setupCards(){

  let h='';

  for(const k in INFO){

    const c=INFO[k];

    h+=`
      <button
        class="card ${k}"
        data-cat="${k}"
      >

        <span class="st">
          30 LEVELS
        </span>

        <div class="ico">
          ${c[1]}
        </div>

        <div class="nm">
          ${c[0]}
        </div>

        <div class="ds">
          ${c[3]}
        </div>

      </button>
    `;
  }

  $('cards').innerHTML=h;

  document
    .querySelectorAll('.card')
    .forEach(b=>{
      b.onclick=()=>select(b.dataset.cat);
    });

  select(G.cat);
}


/* =========================================================
   TIMER / DOM HELPERS
========================================================= */

function clearAll(){

  clearTimeout(G.timer);

  cancelAnimationFrame(G.raf);

  G.timer=0;
  G.raf=0;
}


function wipe(){

  $('arena')
    .querySelectorAll(
      '.target,.dot,.ring,.grid,.sym'
    )
    .forEach(e=>e.remove());
}


function later(ms,fn){

  G.timer=setTimeout(fn,ms);
}


function hud(){

  $('score').textContent=G.score;
  $('streak').textContent=G.streak;
  $('best').textContent=G.best;

  $('cat').textContent=INFO[G.cat][0];

  $('lv').textContent=
    `LEVEL ${G.level} / 30`;

  $('lives').innerHTML=
    [0,1,2]
      .map(i=>
        `<i class="life ${i>=G.lives?'off':''}"></i>`
      )
      .join('');
}


function pos(pad=55){

  const r=
    $('arena').getBoundingClientRect();

  return{
    x:
      pad+
      Math.random()*
      Math.max(
        10,
        r.width-pad*2
      ),

    y:
      pad+
      Math.random()*
      Math.max(
        10,
        r.height-pad*2
      )
  };
}


function target(o={}){

  const e=
    document.createElement('div');

  e.className=
    'target'+
    (o.small?' small':'')+
    (o.tiny?' tiny':'')+
    (o.red?' red':'');

  const p=
    pos(o.pad||55);

  e.style.left=p.x+'px';
  e.style.top=p.y+'px';

  $('arena').appendChild(e);

  return e;
}


function dot(text,x,y,big=false){

  const e=
    document.createElement('div');

  e.className=
    'dot'+
    (big?' big':'');

  e.textContent=text;

  e.style.left=x+'%';
  e.style.top=y+'%';

  $('arena').appendChild(e);

  return e;
}


function makeGrid(cols=4){

  const g=
    document.createElement('div');

  g.className='grid';

  g.style.gridTemplateColumns=
    `repeat(${cols},48px)`;

  $('arena').appendChild(g);

  return g;
}


function feed(t,good=true){

  const e=$('feed');

  e.textContent=t;

  e.className=
    'feed show '+
    (good?'good':'bad');

  setTimeout(
    ()=>e.className='feed',
    650
  );
}


/* =========================================================
   WIN / LOSE
========================================================= */

function win(points,token){

  if(
    token!==G.token ||
    !G.active
  )return;

  G.active=false;

  clearAll();
  wipe();

  G.streak++;

  const n=
    Math.round(
      points*
      (
        1+
        Math.min(
          G.streak*.1,
          2
        )
      )
    );

  G.score+=n;

  if(G.score>G.best){

    G.best=G.score;

    localStorage.brainRushBest=
      G.best;
  }

  feed('+'+n,true);

  hud();

  if(G.level===30){

    later(550,finish);

  }else{

    G.level++;

    later(430,level);
  }
}


function lose(text,token){

  if(
    token!==G.token ||
    !G.active
  )return;

  G.active=false;

  clearAll();
  wipe();

  G.lives--;
  G.streak=0;

  feed(text,false);

  hud();

  if(G.lives<=0){

    later(550,endRun);

  }else{

    G.level++;

    later(600,level);
  }
}


function deadline(ms,fn){

  later(
    Math.max(1000,ms),
    fn
  );
}


/* =========================================================
   SPEED
========================================================= */

function speed(type,d,t){

  G.active=true;

  if(type==='reaction'){

    const q=
      target({
        small:d>1,
        tiny:d>2
      });

    q.onclick=
      ()=>win(
        120+d*12,
        t
      );

    deadline(
      2400-d*55,
      ()=>lose(
        'TOO SLOW',
        t
      )
    );

  }

  else if(type==='double'){

    const a=target();

    const b=
      target({
        small:true
      });

    let hit=0;

    [a,b].forEach(q=>{

      q.onclick=()=>{

        q.remove();

        if(++hit===2){

          win(
            150+d*18,
            t
          );
        }
      };
    });

    deadline(
      3000-d*50,
      ()=>lose(
        'MISSED ONE',
        t
      )
    );

  }

  else if(type==='avoid'){

    const a=
      target({
        small:d>2
      });

    const b=
      target({
        red:true,
        small:true
      });

    a.onclick=
      ()=>win(
        155+d*15,
        t
      );

    b.onclick=
      ()=>lose(
        'TRAP!',
        t
      );

    deadline(
      2700-d*50,
      ()=>win(
        155+d*15,
        t
      )
    );

  }

  else if(type==='moving'){

    const q=
      target({
        small:d>1
      });

    const r=
      $('arena')
      .getBoundingClientRect();

    const st=
      performance.now();

    const dur=
      3000-d*180;

    const rad=
      Math.min(
        r.width,
        r.height
      )*.30;

    function loop(now){

      if(!G.active)return;

      const z=
        (now-st)/dur;

      const a=
        z*
        Math.PI*
        (2+d*.25);

      q.style.left=
        r.width/2+
        Math.cos(a)*rad+
        'px';

      q.style.top=
        r.height/2+
        Math.sin(a*1.15)*rad+
        'px';

      G.raf=
        requestAnimationFrame(loop);
    }

    G.raf=
      requestAnimationFrame(loop);

    q.onclick=
      ()=>win(
        175+d*16,
        t
      );

    deadline(
      dur+500,
      ()=>lose(
        'MISSED IT',
        t
      )
    );

  }

  else if(type==='sequence'){

    sequence(d,t);

  }

  else if(type==='rapid'){

    rapid(d,t);

  }

  else if(type==='alternate'){

    alternate(d,t);

  }

  else if(type==='timing'){

    timingSpeed(d,t);

  }

  else if(type==='burst'){

    burst(d,t);

  }

  else{

    mixedSpeed(d,t);
  }
}


function sequence(d,t){

  G.active=false;

  const n=d+2;

  const a=[];

  for(let i=0;i<n;i++){

    a.push(
      dot(
        i+1,
        12+
        i*(76/(n-1)),
        35+
        (i%2)*25
      )
    );
  }

  later(750,()=>{

    a.forEach(
      x=>x.style.opacity=.12
    );

    G.active=true;

    let next=1;

    a.forEach((q,i)=>{

      q.onclick=()=>{

        if(i+1!==next){

          return lose(
            'WRONG ORDER',
            t
          );
        }

        q.remove();

        if(++next>n){

          win(
            180+d*18,
            t
          );
        }
      };
    });

    deadline(
      4000+d*100,
      ()=>lose(
        'TOO SLOW',
        t
      )
    );
  });
}


function rapid(d,t){

  let n=d+2;
  let hit=0;

  function spawn(){

    const q=
      target({
        small:d>3
      });

    q.onclick=()=>{

      q.remove();

      if(++hit===n){

        win(
          175+d*18,
          t
        );

      }else{

        spawn();
      }
    };
  }

  spawn();

  deadline(
    4200-d*120,
    ()=>lose(
      'TOO SLOW',
      t
    )
  );
}


function alternate(d,t){

  let n=d+2;
  let i=0;

  function spawn(){

    const red=
      i%2===1;

    const q=
      target({
        red,
        small:d>3
      });

    $('is').textContent=
      red?'RED NOW':'BLUE NOW';

    q.onclick=()=>{

      if(
        red !==
        (i%2===1)
      ){

        return lose(
          'WRONG COLOUR',
          t
        );
      }

      q.remove();

      i++;

      i<n
        ?spawn()
        :win(
          190+d*20,
          t
        );
    };
  }

  spawn();

  deadline(
    4200-d*100,
    ()=>lose(
      'TOO SLOW',
      t
    )
  );
}


function timingSpeed(d,t){

  const q=
    target({
      small:true
    });

  q.style.opacity=.08;

  setTimeout(()=>{

    if(G.active){

      q.style.opacity=1;
    }

  },700+d*120);

  q.onclick=()=>{

    parseFloat(q.style.opacity)>.8
      ?win(
        200+d*20,
        t
      )
      :lose(
        'TOO EARLY',
        t
      );
  };

  deadline(
    3200,
    ()=>lose(
      'TOO SLOW',
      t
    )
  );
}


function burst(d,t){

  let n=d+2;
  let hit=0;

  for(let i=0;i<n;i++){

    const q=
      target({
        small:true
      });

    q.onclick=()=>{

      if(!G.active)return;

      q.remove();

      if(++hit===n){

        win(
          210+d*22,
          t
        );
      }
    };
  }

  deadline(
    4400-d*80,
    ()=>lose(
      'BURST MISSED',
      t
    )
  );
}


function mixedSpeed(d,t){

  const a=
    target({
      small:true
    });

  const b=
    target({
      red:true,
      small:true
    });

  a.onclick=()=>{

    a.remove();

    const c=
      target({
        tiny:true
      });

    c.onclick=
      ()=>win(
        240+d*25,
        t
      );
  };

  b.onclick=
    ()=>lose(
      'TRAP!',
      t
    );

  deadline(
    5000,
    ()=>lose(
      'TOO SLOW',
      t
    )
  );
}


/* =========================================================
   MEMORY
========================================================= */

function memory(type,d,t){

  G.active=false;

  if(type==='grid'){

    memoryGrid(d,t);

  }

  else if(type==='pairs'){

    memoryPairs(d,t);

  }

  else{

    memorySequence(
      type,
      d,
      t
    );
  }
}


function memorySequence(type,d,t){

  const n=d+2;

  const colors=[
    '#4ff4ff',
    '#c15aff',
    '#5dff9d',
    '#ffe45c',
    '#ff568b'
  ];

  const symbols=[
    '◆',
    '●',
    '▲',
    '■',
    '✦'
  ];

  const seq=
    Array.from(
      {length:n},
      ()=>Math.floor(
        Math.random()*5
      )
    );

  const q=
    document.createElement('div');

  q.className='sym';

  $('arena')
    .appendChild(q);

  let i=0;

  function show(){

    if(i>=n){

      q.remove();

      answer();

      return;
    }

    q.textContent=
      type==='symbol'
        ?symbols[seq[i]]
        :seq[i]+1;

    q.style.color=
      colors[seq[i]];

    i++;

    later(
      type==='flash'
        ?360
        :450,
      show
    );
  }

  function answer(){

    G.active=true;

    let idx=
      type==='reverse'
        ?n-1
        :0;

    let step=
      type==='reverse'
        ?-1
        :1;

    [
      ...new Set(
        seq.concat(
          [0,1,2,3,4]
        )
      )
    ]
    .sort(
      ()=>Math.random()-.5
    )
    .forEach((v,j)=>{

      const b=
        dot(
          type==='symbol'
            ?symbols[v]
            :v+1,
          10+j*20,
          78
        );

      b.style.background=
        colors[v];

      b.onclick=()=>{

        if(v!==seq[idx]){

          return lose(
            'WRONG MEMORY',
            t
          );
        }

        b.remove();

        idx+=step;

        if(
          idx<0 ||
          idx>=n
        ){

          win(
            200+d*18,
            t
          );
        }
      };
    });

    deadline(
      6000+d*250,
      ()=>lose(
        'MEMORY LOST',
        t
      )
    );
  }

  later(
    type==='flash'
      ?850
      :1200,
    show
  );
}


function memoryGrid(d,t){

  const cols=
    d>5
      ?5
      :4;

  const g=
    makeGrid(cols);

  const n=
    Math.min(
      d+1,
      cols*cols-2
    );

  const chosen=[];

  while(
    chosen.length<n
  ){

    const x=
      Math.floor(
        Math.random()*
        cols*
        cols
      );

    if(
      !chosen.includes(x)
    ){

      chosen.push(x);
    }
  }

  for(
    let i=0;
    i<cols*cols;
    i++
  ){

    const c=
      document.createElement('div');

    c.className='cell';

    if(
      chosen.includes(i)
    ){

      c.classList.add('hot');
    }

    g.appendChild(c);
  }

  later(1000,()=>{

    g.querySelectorAll(
      '.cell'
    ).forEach(
      c=>c.classList.remove('hot')
    );

    G.active=true;

    let hit=0;

    g.querySelectorAll(
      '.cell'
    ).forEach((c,i)=>{

      c.onclick=()=>{

        if(
          !chosen.includes(i)
        ){

          return lose(
            'WRONG CELL',
            t
          );
        }

        c.classList.add(
          'correct'
        );

        if(++hit===n){

          win(
            210+d*18,
            t
          );
        }
      };
    });

    deadline(
      6000+d*300,
      ()=>lose(
        'MEMORY LOST',
        t
      )
    );
  });
}


function memoryPairs(d,t){

  const n=d+1;

  const g=
    makeGrid(4);

  const vals=[];

  for(
    let i=0;
    i<n;
    i++
  ){

    vals.push(i,i);
  }

  vals.sort(
    ()=>Math.random()-.5
  );

  vals.forEach(v=>{

    const c=
      document.createElement('div');

    c.className='cell';

    c.dataset.v=v;

    g.appendChild(c);
  });

  G.active=true;

  let open=null;
  let hit=0;

  g.querySelectorAll(
    '.cell'
  ).forEach(c=>{

    c.onclick=()=>{

      if(
        !G.active ||
        c.classList.contains('correct') ||
        c===open
      ){

        return;
      }

      c.textContent=
        c.dataset.v;

      c.classList.add('hot');

      if(!open){

        open=c;

        return;
      }

      if(
        open.dataset.v===
        c.dataset.v
      ){

        open.classList.add(
          'correct'
        );

        c.classList.add(
          'correct'
        );

        open=null;

        if(++hit===n){

          win(
            240+d*20,
            t
          );
        }

      }else{

        const old=open;

        open=null;

        setTimeout(()=>{

          old.textContent='';
          c.textContent='';

          old.classList.remove(
            'hot'
          );

          c.classList.remove(
            'hot'
          );

        },280);
      }
    };
  });

  deadline(
    7500+d*250,
    ()=>lose(
      'TOO SLOW',
      t
    )
  );
}


/* =========================================================
   OBSERVATION
========================================================= */

function observation(type,d,t){

  G.active=true;

  if(type==='odd'){

    const n=d;

    const g=
      makeGrid(
        n>20
          ?6
          :5
      );

    const odd=
      Math.floor(
        Math.random()*n
      );

    for(
      let i=0;
      i<n;
      i++
    ){

      const c=
        document.createElement('div');

      c.className='cell';

      if(i===odd){

        c.style.transform=
          'rotate(45deg)';
      }

      g.appendChild(c);

      c.onclick=()=>{

        i===odd
          ?win(
            190+d*10,
            t
          )
          :lose(
            'WRONG ONE',
            t
          );
      };
    }

    deadline(
      5000,
      ()=>lose(
        'TOO SLOW',
        t
      )
    );

  }

  else if(type==='count'){

    const n=d;

    const g=
      makeGrid(5);

    for(
      let i=0;
      i<n+5;
      i++
    ){

      const c=
        document.createElement('div');

      c.className='cell';

      if(i<n){

        c.classList.add(
          'hot'
        );
      }

      g.appendChild(c);
    }

    [
      n-1,
      n,
      n+1,
      n+2
    ].forEach((v,i)=>{

      const b=
        dot(
          v,
          18+i*21,
          82
        );

      b.onclick=()=>{

        v===n
          ?win(
            190+d*10,
            t
          )
          :lose(
            'WRONG COUNT',
            t
          );
      };
    });

    deadline(
      4500,
      ()=>lose(
        'TOO SLOW',
        t
      )
    );

  }

  else if(type==='missing'){

    const n=d;

    const g=
      makeGrid(5);

    const m=
      Math.floor(
        Math.random()*n
      );

    for(
      let i=0;
      i<n;
      i++
    ){

      const c=
        document.createElement('div');

      c.className='cell';

      c.textContent=
        i===m
          ?''
          :i+1;

      g.appendChild(c);

      c.onclick=()=>{

        i===m
          ?win(
            200+d*10,
            t
          )
          :lose(
            'WRONG TILE',
            t
          );
      };
    }

    deadline(
      4500,
      ()=>lose(
        'TOO SLOW',
        t
      )
    );

  }

  else if(type==='compare'){

    const a=
      10+
      Math.floor(
        Math.random()*50
      );

    const b=
      a+d+1;

    const x=
      dot(
        a,
        35,
        45
      );

    const y=
      dot(
        b,
        65,
        45
      );

    x.onclick=
      ()=>lose(
        'WRONG SIDE',
        t
      );

    y.onclick=
      ()=>win(
        205+d*12,
        t
      );

    deadline(
      3500,
      ()=>lose(
        'TOO SLOW',
        t
      )
    );

  }

  else{

    changeObservation(
      d,
      t
    );
  }
}


function changeObservation(d,t){

  G.active=false;

  const g=
    makeGrid(4);

  const changed=
    Math.floor(
      Math.random()*12
    );

  for(
    let i=0;
    i<12;
    i++
  ){

    const c=
      document.createElement('div');

    c.className='cell';

    c.textContent=
      i===changed
        ?'▲'
        :'●';

    g.appendChild(c);
  }

  later(950,()=>{

    g.remove();

    const h=
      makeGrid(4);

    for(
      let i=0;
      i<12;
      i++
    ){

      const c=
        document.createElement('div');

      c.className='cell';

      c.textContent=
        i===changed
          ?'◆'
          :'●';

      h.appendChild(c);

      c.onclick=()=>{

        i===changed
          ?win(
            220+d*12,
            t
          )
          :lose(
            'WRONG CHANGE',
            t
          );
      };
    }

    G.active=true;

    deadline(
      4000,
      ()=>lose(
        'TOO SLOW',
        t
      )
    );
  });
}


/* =========================================================
   PRECISION
========================================================= */

function precision(type,d,t){

  G.active=true;

  if(type==='center'){

    const q=
      target({
        small:d>2
      });

    q.onclick=
      ()=>win(
        190+d*15,
        t
      );

  }

  else if(type==='ring'){

    const q=
      document.createElement('div');

    q.className='ring';

    const p=pos();

    const z=
      Math.max(
        65,
        150-d*15
      );

    q.style.cssText=
      `width:${z}px;
       height:${z}px;
       left:${p.x}px;
       top:${p.y}px`;

    $('arena')
      .appendChild(q);

    q.onclick=
      ()=>win(
        205+d*16,
        t
      );

  }

  else if(type==='tiny'){

    const q=
      target({
        tiny:true
      });

    q.onclick=
      ()=>win(
        220+d*18,
        t
      );

  }

  else if(type==='zone'){

    const p=pos();

    const q=
      target({
        tiny:true
      });

    q.style.left=
      p.x+'px';

    q.style.top=
      p.y+'px';

    const z=
      document.createElement('div');

    z.className='ring';

    z.style.cssText=
      `width:${150-d*12}px;
       height:${150-d*12}px;
       left:${p.x}px;
       top:${p.y}px;
       border-style:dashed`;

    $('arena')
      .appendChild(z);

    q.onclick=
      ()=>win(
        230+d*18,
        t
      );

  }

  else if(type==='moving'){

    speed(
      'moving',
      d,
      t
    );

    return;

  }

  else{

    timingPrecision(
      d,
      t
    );
  }

  deadline(
    3500-d*120,
    ()=>lose(
      'TOO SLOW',
      t
    )
  );
}


function timingPrecision(d,t){

  const q=
    target({
      tiny:true
    });

  q.style.opacity=.08;

  setTimeout(()=>{

    if(G.active){

      q.style.opacity=1;
    }

  },700+d*220);

  q.onclick=()=>{

    parseFloat(q.style.opacity)>.8
      ?win(
        235+d*18,
        t
      )
      :lose(
        'TOO EARLY',
        t
      );
  };

  deadline(
    3600,
    ()=>lose(
      'TOO SLOW',
      t
    )
  );
}


/* =========================================================
   PATTERN
========================================================= */

function pattern(type,d,t){

  G.active=false;

  if(type==='number'){

    patternNumber(d,t);

  }

  else if(type==='color'){

    patternColor(d,t);

  }

  else if(type==='shape'){

    patternShape(d,t);

  }

  else if(type==='grid'){

    patternGrid(d,t);

  }

  else if(type==='mirror'){

    patternMirror(d,t);

  }

  else{

    patternLogic(d,t);
  }
}


function choices(vals,answer,points,t){

  G.active=true;

  vals
    .sort(
      ()=>Math.random()-.5
    )
    .forEach((v,i)=>{

      const b=
        dot(
          v,
          10+
          i*
          (
            80/
            (vals.length-1)
          ),
          78
        );

      b.onclick=()=>{

        String(v)===String(answer)
          ?win(
            points,
            t
          )
          :lose(
            'WRONG PATTERN',
            t
          );
      };
    });

  deadline(
    5000,
    ()=>lose(
      'TOO SLOW',
      t
    )
  );
}


function patternNumber(d,t){

  const start=
    2+d;

  const step=
    2+d%4;

  const seq=[
    start,
    start+step,
    start+2*step,
    start+3*step
  ];

  const ans=
    start+4*step;

  const q=
    document.createElement('div');

  q.className='sym';

  q.textContent=
    seq.join(' · ');

  $('arena')
    .appendChild(q);

  later(900,()=>{

    q.remove();

    choices(
      [
        ans,
        ans+step,
        ans-step,
        ans+2*step
      ],
      ans,
      220+d*16,
      t
    );
  });
}


function patternColor(d,t){

  const co=[
    'CYAN',
    'PURPLE',
    'GREEN',
    'YELLOW'
  ];

  const ans=
    co[(4+d)%4];

  const q=
    document.createElement('div');

  q.className='sym';

  q.textContent=
    co.map(
      (x,i)=>
        co[(i+d)%4]
    ).join(' · ');

  $('arena')
    .appendChild(q);

  later(900,()=>{

    q.remove();

    choices(
      [...co],
      ans,
      220+d*16,
      t
    );
  });
}


function patternShape(d,t){

  const co=[
    '◆',
    '●',
    '▲',
    '■'
  ];

  const ans=
    co[(4+d)%4];

  const q=
    document.createElement('div');

  q.className='sym';

  q.textContent=
    co.map(
      (x,i)=>
        co[(i+d)%4]
    ).join(' · ');

  $('arena')
    .appendChild(q);

  later(900,()=>{

    q.remove();

    choices(
      [...co],
      ans,
      220+d*16,
      t
    );
  });
}


function patternGrid(d,t){

  const g=
    makeGrid(4);

  const path=[
    0,
    1,
    5,
    9,
    10
  ];

  const next=
    path[d%path.length];

  for(
    let i=0;
    i<12;
    i++
  ){

    const c=
      document.createElement('div');

    c.className='cell';

    if(
      path
        .slice(
          0,
          path.indexOf(next)
        )
        .includes(i)
    ){

      c.classList.add('hot');
    }

    g.appendChild(c);

    c.onclick=()=>{

      i===next
        ?win(
          230+d*16,
          t
        )
        :lose(
          'WRONG PATH',
          t
        );
    };
  }

  G.active=true;

  deadline(
    4500,
    ()=>lose(
      'TOO SLOW',
      t
    )
  );
}


function patternMirror(d,t){

  const a=
    dot(
      '◢',
      35,
      45,
      true
    );

  const b=
    dot(
      '◣',
      65,
      45,
      true
    );

  a.onclick=
    ()=>lose(
      'WRONG MIRROR',
      t
    );

  b.onclick=
    ()=>win(
      225+d*16,
      t
    );

  G.active=true;

  deadline(
    3800,
    ()=>lose(
      'TOO SLOW',
      t
    )
  );
}


function patternLogic(d,t){

  const a=
    3+d;

  const b=
    5+d*2;

  const c=
    7+d*3;

  const ans=
    c+(b-a);

  const q=
    document.createElement('div');

  q.className='sym';

  q.textContent=
    `${a} · ${b} · ${c} · ?`;

  $('arena')
    .appendChild(q);

  later(900,()=>{

    q.remove();

    choices(
      [
        ans,
        ans+2,
        ans-2,
        ans+4
      ],
      ans,
      240+d*18,
      t
    );
  });
}


/* =========================================================
   TRAP
========================================================= */

function trap(type,d,t){

  G.active=true;

  if(
    type==='safe' ||
    type==='decoy'
  ){

    const n=d;

    const safe=
      Math.floor(
        Math.random()*n
      );

    for(
      let i=0;
      i<n;
      i++
    ){

      const q=
        target({
          small:d>5,
          red:i!==safe
        });

      q.onclick=()=>{

        i===safe
          ?win(
            205+d*14,
            t
          )
          :lose(
            'DECOY!',
            t
          );
      };
    }

    deadline(
      4000,
      ()=>lose(
        'TOO SLOW',
        t
      )
    );

  }

  else if(
    type==='red' ||
    type==='false'
  ){

    const a=
      target({
        small:true
      });

    const b=
      target({
        red:true,
        small:true
      });

    a.onclick=
      ()=>win(
        215+d*15,
        t
      );

    b.onclick=
      ()=>lose(
        'TRAP!',
        t
      );

    deadline(
      3500,
      ()=>lose(
        'TOO SLOW',
        t
      )
    );

  }

  else if(type==='bait'){

    const big=
      target();

    const small=
      target({
        tiny:true
      });

    big.classList.add('red');

    big.onclick=
      ()=>lose(
        'BAIT!',
        t
      );

    small.onclick=
      ()=>win(
        225+d*15,
        t
      );

    deadline(
      3600,
      ()=>lose(
        'TOO SLOW',
        t
      )
    );

  }

  else if(
    type==='freeze' ||
    type==='speedTrap'
  ){

    const q=
      target({
        small:true
      });

    q.style.opacity=.08;

    const delay=
      800+d*180;

    setTimeout(()=>{

      if(G.active){

        q.style.opacity=1;
      }

    },delay);

    q.onclick=()=>{

      parseFloat(q.style.opacity)>.8
        ?win(
          230+d*16,
          t
        )
        :lose(
          'TOO EARLY',
          t
        );
    };

    deadline(
      4000,
      ()=>lose(
        'TOO SLOW',
        t
      )
    );

  }

  else if(type==='multi'){

    const blue=
      target({
        small:true
      });

    const red=
      target({
        red:true,
        small:true
      });

    const third=
      target({
        small:true
      });

    blue.onclick=
      ()=>win(
        245+d*18,
        t
      );

    red.onclick=
      ()=>lose(
        'RED TRAP!',
        t
      );

    third.onclick=
      ()=>lose(
        'DECOY!',
        t
      );

    deadline(
      4000,
      ()=>lose(
        'TOO SLOW',
        t
      )
    );

  }

  else{

    mixedTrap(
      d,
      t
    );
  }
}


function mixedTrap(d,t){

  const safe=
    target({
      small:true
    });

  const red=
    target({
      red:true,
      small:true
    });

  safe.onclick=()=>{

    safe.remove();

    const q=
      target({
        tiny:true
      });

    q.onclick=
      ()=>win(
        270+d*20,
        t
      );
  };

  red.onclick=
    ()=>lose(
      'TRAP!',
      t
    );

  deadline(
    5000,
    ()=>lose(
      'TOO SLOW',
      t
    )
  );
}


/* =========================================================
   LEVEL ENGINE
========================================================= */

function run(type,d,t){

  if(G.cat==='speed'){

    speed(type,d,t);

  }

  else if(G.cat==='memory'){

    memory(type,d,t);

  }

  else if(G.cat==='observation'){

    observation(type,d,t);

  }

  else if(G.cat==='precision'){

    precision(type,d,t);

  }

  else if(G.cat==='pattern'){

    pattern(type,d,t);

  }

  else if(G.cat==='trap'){

    trap(type,d,t);
  }
}


function level(){

  clearAll();
  wipe();

  G.token++;

  const t=G.token;

  const lv=
    LEVELS[G.cat][G.level-1];

  const type=lv.type;

  const d=lv.d;

  hud();

  $('ih').textContent=
    INFO[G.cat][0]+
    ' CHALLENGE';

  $('im').textContent=
    TEXT[type]||
    'COMPLETE THE CHALLENGE';

  const fresh=
    type!==G.lastType;

  G.lastType=type;

  $('is').textContent=
    fresh
      ?'READ THE RULE'
      :'GO!';

  $('arena')
    .classList
    .toggle(
      'read',
      fresh
    );

  later(
    fresh
      ?850
      :180,
    ()=>{

      if(t!==G.token)return;

      $('arena')
        .classList
        .remove('read');

      $('is').textContent='GO!';

      run(
        type,
        d,
        t
      );
    }
  );
}


/* =========================================================
   COUNTDOWN
========================================================= */

function countdown(done){

  const c=$('count');
  const n=$('num');

  let x=3;

  c.classList.add('active');

  function go(){

    n.textContent=
      x||'GO!';

    if(!x){

      return setTimeout(()=>{

        c.classList.remove(
          'active'
        );

        done();

      },300);
    }

    x--;

    setTimeout(
      go,
      500
    );
  }

  go();
}


/* =========================================================
   START / END
========================================================= */

function start(){

  if(G.busy)return;

  G.busy=true;

  clearAll();
  wipe();

  G.level=1;
  G.score=0;
  G.streak=0;
  G.lives=3;
  G.lastType=null;

  G.token++;

  $('home')
    .classList
    .remove('active');

  $('game')
    .classList
    .add('active');

  hud();

  countdown(()=>{

    G.busy=false;

    level();
  });
}


function endRun(){

  clearAll();
  wipe();

  G.active=false;

  $('et').textContent=
    'RUN OVER';

  $('es').textContent=
    `${INFO[G.cat][0]} · you reached level ${G.level}.`;

  $('ev').textContent=
    G.score;

  $('overlay')
    .classList
    .add('active');
}


function finish(){

  clearAll();
  wipe();

  G.active=false;

  $('et').textContent=
    'CATEGORY COMPLETE';

  $('es').textContent=
    `You completed all 30 ${INFO[G.cat][0]} levels.`;

  $('ev').textContent=
    G.score;

  $('overlay')
    .classList
    .add('active');
}


function goHome(){

  clearAll();
  wipe();

  G.token++;
  G.busy=false;

  $('overlay')
    .classList
    .remove('active');

  $('game')
    .classList
    .remove('active');

  $('home')
    .classList
    .add('active');
}


/* =========================================================
   EVENTS
========================================================= */

$('start').onclick=start;

$('again').onclick=start;

$('homeBtn').onclick=goHome;

$('quit').onclick=goHome;


document.addEventListener(
  'visibilitychange',
  ()=>{
    if(
      document.hidden &&
      $('game')
        .classList
        .contains('active')
    ){

      clearAll();

      G.token++;

      G.active=false;
    }
  }
);


/* =========================================================
   INITIALISE
========================================================= */

setupCards();

hud();


/* Verify exactly 30 levels per category */

console.assert(
  Object.values(LEVELS)
    .every(
      a=>a.length===30
    ),
  'Every category must contain 30 levels'
);

</script>
