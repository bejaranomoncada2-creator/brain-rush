<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Brain Rush</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#03040d;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
  overscroll-behavior:none;
}

button{
  font:inherit;
  -webkit-appearance:none;
}

#app{
  min-height:100vh;
  position:relative;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 10%,
      rgba(55,70,210,.28),
      transparent 36%
    ),
    radial-gradient(
      circle at 10% 75%,
      rgba(170,0,255,.10),
      transparent 35%
    ),
    radial-gradient(
      circle at 90% 75%,
      rgba(0,255,220,.08),
      transparent 35%
    ),
    #03040d;
}

#app::before{
  content:"";
  position:absolute;
  left:-20%;
  right:-20%;
  top:34%;
  height:80%;
  pointer-events:none;
  opacity:.20;

  background-image:
    linear-gradient(
      rgba(70,120,255,.12) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(70,120,255,.12) 1px,
      transparent 1px
    );

  background-size:42px 42px;

  transform:
    perspective(600px)
    rotateX(60deg)
    scale(1.7);

  transform-origin:center bottom;
}


/* =========================================================
   SCREENS
========================================================= */

.screen{
  position:relative;
  z-index:2;

  width:100%;
  min-height:100vh;

  display:none;

  padding:42px 22px 55px;
}

.screen.active{
  display:block;
}


/* =========================================================
   HOME
========================================================= */

.home{
  width:100%;
  max-width:760px;
  margin:0 auto;
  text-align:center;
}

.logo{
  margin-top:5px;

  font-size:clamp(
    42px,
    11vw,
    78px
  );

  font-weight:1000;
  font-style:italic;

  letter-spacing:-3px;
  line-height:.9;

  background:
    linear-gradient(
      90deg,
      #e9ffff 0%,
      #ffffff 28%,
      #48efff 55%,
      #ff38d7 82%,
      #ffffff 100%
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;

  filter:
    drop-shadow(
      0 0 10px
      rgba(60,230,255,.65)
    )
    drop-shadow(
      0 0 28px
      rgba(255,30,210,.35)
    );
}

.tagline{
  margin-top:15px;

  font-size:12px;
  letter-spacing:6px;

  color:#d9d9e9;
}

.choose{
  margin-top:62px;
  margin-bottom:26px;

  font-size:20px;
  letter-spacing:4px;
  font-weight:700;
}

.mode-grid{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:16px;
}

.mode-card{
  position:relative;

  min-height:190px;

  padding:28px 26px;

  border-radius:28px;

  text-align:left;

  border:1px solid
    rgba(110,130,255,.13);

  background:
    linear-gradient(
      145deg,
      rgba(15,22,60,.75),
      rgba(6,8,25,.78)
    );

  box-shadow:
    inset 0 0 35px
    rgba(60,80,255,.035),

    0 12px 40px
    rgba(0,0,0,.25);

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    border-color .2s ease;

  cursor:pointer;

  overflow:hidden;
}

.mode-card:active{
  transform:scale(.985);
}

.mode-card.active{
  border-color:#35eaff;

  box-shadow:
    0 0 10px
    rgba(30,240,255,.4),

    0 0 28px
    rgba(30,240,255,.16),

    inset 0 0 30px
    rgba(30,240,255,.06);
}

.mode-card.locked{
  opacity:.35;
  cursor:not-allowed;
}

.mode-icon{
  font-size:42px;

  margin-bottom:25px;

  filter:
    drop-shadow(
      0 0 10px currentColor
    );
}

.mode-name{
  font-size:21px;
  font-weight:900;
  letter-spacing:1px;
}

.mode-desc{
  margin-top:10px;

  color:#8d91a9;

  font-size:14px;
  line-height:1.4;
}

.mode-status{
  position:absolute;

  top:24px;
  right:22px;

  font-size:10px;

  font-weight:bold;

  letter-spacing:1px;
}

.speed{
  color:#2defff;
}

.memory{
  color:#b847ff;
}

.observation{
  color:#3cff9d;
}

.precision{
  color:#ffdf42;
}

.pattern{
  color:#d65aff;
}

.trap{
  color:#ff477d;
}

.start-button{
  width:100%;

  margin-top:20px;

  min-height:62px;

  border:0;

  border-radius:22px;

  cursor:pointer;

  font-weight:900;

  letter-spacing:4px;

  color:#081021;

  background:
    linear-gradient(
      100deg,
      #55f4ff,
      #b8f9ff 40%,
      #9b54ff 100%
    );

  box-shadow:
    0 0 15px
    rgba(70,240,255,.45),

    0 0 35px
    rgba(130,70,255,.22);
}

.start-button:active{
  transform:scale(.985);
}

.home-foot{
  margin-top:22px;

  color:#9b9db1;

  font-size:12px;

  letter-spacing:2px;
}


/* =========================================================
   GAME
========================================================= */

#gameScreen{
  padding:
    18px
    16px
    30px;
}

.game-shell{
  width:100%;
  max-width:900px;
  margin:0 auto;
}

.game-top{
  display:grid;

  grid-template-columns:
    1fr 1fr 1fr;

  gap:10px;

  margin-bottom:13px;
}

.stat{
  padding:12px 10px;

  border-radius:15px;

  text-align:center;

  border:
    1px solid
    rgba(70,240,255,.14);

  background:
    rgba(8,12,32,.8);
}

.stat-label{
  font-size:9px;

  letter-spacing:2px;

  color:#777b99;
}

.stat-value{
  margin-top:4px;

  font-size:20px;

  font-weight:900;
}

#scoreValue{
  color:#54f4ff;
}

#streakValue{
  color:#ff4edc;
}

#bestValue{
  color:#ffe15a;
}

.level-row{
  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:0 4px;

  margin-bottom:10px;
}

.level-number{
  color:#8c91a9;

  font-size:12px;

  letter-spacing:2px;
}

.lives{
  display:flex;
  gap:5px;
}

.life{
  width:13px;
  height:13px;

  border-radius:50%;

  background:#ff397d;

  box-shadow:
    0 0 10px
    rgba(255,50,130,.75);
}

.life.off{
  background:#27293a;
  box-shadow:none;
}

.instruction{
  position:relative;
  z-index:20;

  min-height:92px;

  padding:
    16px
    18px;

  border-radius:20px;

  border:
    1px solid
    rgba(75,239,255,.35);

  background:
    linear-gradient(
      135deg,
      rgba(13,24,55,.94),
      rgba(9,10,32,.94)
    );

  text-align:center;

  box-shadow:
    0 0 22px
    rgba(30,230,255,.08);
}

.instruction-small{
  color:#6eefff;

  font-size:10px;

  letter-spacing:3px;

  font-weight:800;
}

.instruction-main{
  margin-top:7px;

  font-size:
    clamp(
      17px,
      4vw,
      25px
    );

  font-weight:900;

  letter-spacing:1px;
}

.instruction-state{
  margin-top:6px;

  min-height:17px;

  color:#8f94ad;

  font-size:11px;

  letter-spacing:2px;
}

.arena{
  position:relative;

  height:
    min(
      64vh,
      560px
    );

  min-height:400px;

  margin-top:14px;

  overflow:hidden;

  border-radius:28px;

  border:
    1px solid
    rgba(85,100,255,.2);

  background:
    radial-gradient(
      circle at 50% 50%,
      rgba(20,30,75,.3),
      transparent 60%
    ),
    rgba(4,6,20,.88);

  box-shadow:
    inset 0 0 80px
    rgba(20,30,100,.08),

    0 15px 50px
    rgba(0,0,0,.3);

  touch-action:manipulation;
}

.arena::before{
  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  background-image:
    linear-gradient(
      rgba(70,120,255,.06) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(70,120,255,.06) 1px,
      transparent 1px
    );

  background-size:40px 40px;
}

.arena.reading::after{
  content:"READ";

  position:absolute;

  inset:0;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:48px;

  font-weight:1000;

  letter-spacing:8px;

  color:
    rgba(90,240,255,.12);

  pointer-events:none;
}

.target{
  position:absolute;

  width:70px;
  height:70px;

  border-radius:50%;

  cursor:pointer;

  transform:
    translate(
      -50%,
      -50%
    );

  background:
    radial-gradient(
      circle,
      #fff 0 8%,
      #65f7ff 10% 23%,
      #00cfff 25% 42%,
      rgba(0,207,255,.22)
      44% 65%,
      transparent 68%
    );

  box-shadow:
    0 0 12px #52f4ff,

    0 0 35px
    rgba(30,235,255,.75),

    0 0 70px
    rgba(30,150,255,.3);

  animation:
    targetPulse
    .8s
    infinite
    alternate;

  z-index:10;
}

@keyframes targetPulse{

  from{
    transform:
      translate(
        -50%,
        -50%
      )
      scale(.94);
  }

  to{
    transform:
      translate(
        -50%,
        -50%
      )
      scale(1.08);
  }

}

.target.small{
  width:48px;
  height:48px;
}

.target.danger{
  background:
    radial-gradient(
      circle,
      #fff 0 7%,
      #ff5c9c 10% 25%,
      #ff145e 28% 45%,
      rgba(255,20,94,.18)
      48% 65%,
      transparent 68%
    );

  box-shadow:
    0 0 15px #ff377b,

    0 0 40px
    rgba(255,30,100,.7);
}

.target.moving{
  animation:none;
}

.sequence-dot{
  position:absolute;

  width:48px;
  height:48px;

  border-radius:50%;

  display:flex;

  align-items:center;
  justify-content:center;

  font-weight:900;

  font-size:18px;

  background:#111a42;

  border:
    2px solid
    #54f4ff;

  color:#fff;

  box-shadow:
    0 0 20px
    rgba(50,230,255,.35);

  transform:
    translate(
      -50%,
      -50%
    );

  z-index:10;
}

.feedback{
  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(
      -50%,
      -50%
    );

  z-index:30;

  pointer-events:none;

  font-size:34px;

  font-weight:1000;

  letter-spacing:3px;

  opacity:0;
}

.feedback.show{
  animation:
    feedback
    .55s
    ease-out;
}

.feedback.good{
  color:#5dffbd;

  text-shadow:
    0 0 25px
    rgba(80,255,190,.8);
}

.feedback.bad{
  color:#ff4f88;

  text-shadow:
    0 0 25px
    rgba(255,50,110,.8);
}

@keyframes feedback{

  0%{
    opacity:0;

    transform:
      translate(
        -50%,
        -50%
      )
      scale(.7);
  }

  25%{
    opacity:1;
  }

  100%{
    opacity:0;

    transform:
      translate(
        -50%,
        -80%
      )
      scale(1.1);
  }

}

.particle{
  position:absolute;

  width:5px;
  height:5px;

  border-radius:50%;

  background:#62f5ff;

  pointer-events:none;

  animation:
    particle
    .65s
    ease-out
    forwards;

  z-index:40;
}

@keyframes particle{

  to{
    transform:
      translate(
        var(--x),
        var(--y)
      )
      scale(0);

    opacity:0;
  }

}

.game-bottom{
  margin-top:13px;

  display:flex;

  gap:10px;
}

.game-button{
  flex:1;

  min-height:48px;

  border-radius:15px;

  border:
    1px solid
    rgba(100,110,255,.25);

  background:
    rgba(12,15,40,.9);

  color:#bbbfd3;

  cursor:pointer;
}

.game-button:active{
  transform:scale(.98);
}


/* =========================================================
   COUNTDOWN
========================================================= */

.countdown{
  position:fixed;

  inset:0;

  z-index:90;

  display:none;

  align-items:center;
  justify-content:center;

  pointer-events:none;

  background:
    rgba(2,3,12,.55);

  backdrop-filter:blur(5px);
}

.countdown.show{
  display:flex;
}

.countdown-number{
  font-size:
    clamp(
      90px,
      28vw,
      220px
    );

  font-weight:1000;

  font-style:italic;

  color:#fff;

  text-shadow:
    0 0 20px #4defff,

    0 0 70px
    rgba(40,220,255,.8);

  animation:
    countPop
    .75s
    ease-out;
}

@keyframes countPop{

  0%{
    opacity:0;

    transform:scale(1.5);
  }

  30%{
    opacity:1;
  }

  100%{
    opacity:0;

    transform:scale(.9);
  }

}


/* =========================================================
   RESULT OVERLAY
========================================================= */

.overlay{
  position:fixed;

  inset:0;

  z-index:100;

  display:none;

  align-items:center;
  justify-content:center;

  padding:24px;

  background:
    rgba(1,2,10,.82);

  backdrop-filter:blur(10px);
}

.overlay.show{
  display:flex;
}

.overlay-box{
  width:
    min(
      480px,
      100%
    );

  padding:
    34px
    24px;

  text-align:center;

  border-radius:28px;

  border:
    1px solid
    rgba(75,240,255,.28);

  background:
    linear-gradient(
      145deg,
      rgba(11,20,48,.98),
      rgba(5,6,22,.98)
    );

  box-shadow:
    0 0 60px
    rgba(20,220,255,.12);
}

.overlay-title{
  font-size:38px;

  font-weight:1000;

  letter-spacing:2px;
}

.overlay-sub{
  margin-top:10px;

  color:#9296ad;

  line-height:1.6;
}

.overlay-score{
  margin:
    24px 0;

  font-size:44px;

  font-weight:1000;

  color:#55efff;
}

.overlay-button{
  width:100%;

  min-height:54px;

  border:0;

  border-radius:18px;

  cursor:pointer;

  font-weight:900;

  letter-spacing:3px;

  background:
    linear-gradient(
      100deg,
      #52efff,
      #a653ff
    );

  color:#07101f;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

  .screen{
    padding:
      28px
      16px
      40px;
  }

  .choose{
    margin-top:46px;

    font-size:17px;
  }

  .mode-grid{
    gap:11px;
  }

  .mode-card{
    min-height:160px;

    padding:
      20px
      18px;

    border-radius:23px;
  }

  .mode-icon{
    font-size:32px;

    margin-bottom:20px;
  }

  .mode-name{
    font-size:17px;
  }

  .mode-desc{
    font-size:11px;
  }

  .arena{
    min-height:430px;

    height:60vh;
  }

  .target{
    width:62px;
    height:62px;
  }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }

}

</style>
</head>


<body>

<div id="app">


<!-- =======================================================
     HOME
======================================================= -->

<section
  id="homeScreen"
  class="screen active"
>

  <div class="home">

    <div class="logo">
      BRAIN RUSH
    </div>

    <div class="tagline">
      THINK FAST. SEE FASTER.
    </div>

    <div class="choose">
      CHOOSE YOUR BATTLE
    </div>


    <div class="mode-grid">


      <!-- SPEED -->

      <button
        id="speedMode"
        class="mode-card active speed"
        type="button"
      >

        <div class="mode-status">
          30 LEVELS
        </div>

        <div class="mode-icon">
          ϟ
        </div>

        <div class="mode-name">
          SPEED
        </div>

        <div class="mode-desc">
          Reaction · timing · pressure
        </div>

      </button>


      <!-- MEMORY -->

      <button
        class="mode-card locked memory"
        type="button"
        disabled
      >

        <div class="mode-status">
          LOCKED
        </div>

        <div class="mode-icon">
          ▥
        </div>

        <div class="mode-name">
          MEMORY
        </div>

        <div class="mode-desc">
          Remember · adapt · repeat
        </div>

      </button>


      <!-- OBSERVATION -->

      <button
        class="mode-card locked observation"
        type="button"
        disabled
      >

        <div class="mode-status">
          LOCKED
        </div>

        <div class="mode-icon">
          ◉
        </div>

        <div class="mode-name">
          OBSERVATION
        </div>

        <div class="mode-desc">
          Notice · compare · detect
        </div>

      </button>


      <!-- PRECISION -->

      <button
        class="mode-card locked precision"
        type="button"
        disabled
      >

        <div class="mode-status">
          LOCKED
        </div>

        <div class="mode-icon">
          ◎
        </div>

        <div class="mode-name">
          PRECISION
        </div>

        <div class="mode-desc">
          Control · accuracy · focus
        </div>

      </button>


      <!-- PATTERN -->

      <button
        class="mode-card locked pattern"
        type="button"
        disabled
      >

        <div class="mode-status">
          LOCKED
        </div>

        <div class="mode-icon">
          ▦
        </div>

        <div class="mode-name">
          PATTERN
        </div>

        <div class="mode-desc">
          Sequence · logic · predict
        </div>

      </button>


      <!-- TRAP -->

      <button
        class="mode-card locked trap"
        type="button"
        disabled
      >

        <div class="mode-status">
          LOCKED
        </div>

        <div class="mode-icon">
          △
        </div>

        <div class="mode-name">
          TRAP
        </div>

        <div class="mode-desc">
          Decoys · danger · instinct
        </div>

      </button>

    </div>


    <button
      id="startBtn"
      class="start-button"
      type="button"
    >
      ⚡ &nbsp; START SPEED RUN
    </button>


    <div class="home-foot">
      30 LEVELS · 3 LIVES · BUILD YOUR STREAK
    </div>

  </div>

</section>



<!-- =======================================================
     GAME
======================================================= -->

<section
  id="gameScreen"
  class="screen"
>

  <div class="game-shell">


    <div class="game-top">


      <div class="stat">

        <div class="stat-label">
          SCORE
        </div>

        <div
          id="scoreValue"
          class="stat-value"
        >
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          STREAK
        </div>

        <div
          id="streakValue"
          class="stat-value"
        >
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          BEST
        </div>

        <div
          id="bestValue"
          class="stat-value"
        >
          0
        </div>

      </div>

    </div>


    <div class="level-row">


      <div
        id="levelNumber"
        class="level-number"
      >
        LEVEL 1 / 30
      </div>


      <div
        id="lives"
        class="lives"
      >

        <div class="life"></div>
        <div class="life"></div>
        <div class="life"></div>

      </div>

    </div>


    <div class="instruction">


      <div class="instruction-small">
        SPEED CHALLENGE
      </div>


      <div
        id="instructionMain"
        class="instruction-main"
      >
        GET READY
      </div>


      <div
        id="instructionState"
        class="instruction-state"
      >
        PREPARE YOUR BRAIN
      </div>

    </div>


    <div
      id="arena"
      class="arena"
    >

      <div
        id="feedback"
        class="feedback"
      ></div>

    </div>


    <div class="game-bottom">

      <button
        id="quitBtn"
        class="game-button"
        type="button"
      >
        QUIT RUN
      </button>

    </div>

  </div>

</section>



<!-- =======================================================
     COUNTDOWN
======================================================= -->

<div
  id="countdown"
  class="countdown"
>

  <div
    id="countdownNumber"
    class="countdown-number"
  >
    3
  </div>

</div>



<!-- =======================================================
     RESULT
======================================================= -->

<div
  id="overlay"
  class="overlay"
>

  <div class="overlay-box">


    <div
      id="overlayTitle"
      class="overlay-title"
    >
      RUN COMPLETE
    </div>


    <div
      id="overlaySub"
      class="overlay-sub"
    >
      You survived the rush.
    </div>


    <div
      id="overlayScore"
      class="overlay-score"
    >
      0
    </div>


    <button
      id="againBtn"
      class="overlay-button"
      type="button"
    >
      RUN AGAIN
    </button>

  </div>

</div>



<script>

/* =========================================================
   DOM HELPER
========================================================= */

function $(id){
  return document.getElementById(id);
}


/* =========================================================
   CONSTANTS
========================================================= */

const TOTAL_LEVELS = 30;

const READING_TIME_NEW = 1000;

const READING_TIME_SAME = 300;


/* =========================================================
   GAME STATE
========================================================= */

let level = 1;

let score = 0;

let streak = 0;

let lives = 3;

let best = 0;

let timer = null;

let animationFrame = null;

let challengeActive = false;

let runStarting = false;

let lastChallengeType = null;

let challengeToken = 0;


/* =========================================================
   BEST SCORE
========================================================= */

try{

  best =
    Number(
      localStorage.getItem(
        "brainRushBest"
      )
    ) || 0;

}catch(error){

  best = 0;

}


/* =========================================================
   LEVEL TYPE
========================================================= */

function levelType(n){

  if(n <= 3)
    return "reaction";

  if(n <= 6)
    return "rapid";

  if(n <= 9)
    return "avoid";

  if(n <= 13)
    return "moving";

  if(n <= 17)
    return "sequence";

  if(n <= 21)
    return "precision";

  if(n <= 24)
    return "reaction";

  if(n <= 26)
    return "rapid";

  if(n <= 28)
    return "moving";

  return "precision";

}


/* =========================================================
   LEVEL NAMES
========================================================= */

function levelName(n){

  const names = {

    1:"FIRST REFLEX",
    2:"WAKE UP",
    3:"QUICK HIT",

    4:"RAPID FIRE",
    5:"DOUBLE TAP",
    6:"NO HESITATION",

    7:"DON'T JUMP",
    8:"STAY CALM",
    9:"TRAP AWARE",

    10:"MOVING TARGET",
    11:"CHASE IT",
    12:"SLIPPING AWAY",
    13:"TRACKER",

    14:"COLOUR MEMORY",
    15:"SEQUENCE ASSAULT",
    16:"REMEMBER",
    17:"NO MISTAKES",

    18:"PRECISION",
    19:"TINY TARGET",
    20:"LASER FOCUS",
    21:"PINPOINT",

    22:"REFLEX TEST",
    23:"REACTION RUSH",
    24:"ZERO DELAY",

    25:"RAPID FIRE II",
    26:"PRESSURE",

    27:"MOVING CHAOS",
    28:"TARGET STORM",

    29:"FINAL REFLEX",
    30:"BRAIN RUSH"

  };

  return (
    names[n] ||
    "SPEED CHALLENGE"
  );

}


/* =========================================================
   INSTRUCTIONS
========================================================= */

function instructionFor(type){

  if(type === "reaction")
    return "TAP THE GLOWING TARGET";

  if(type === "rapid")
    return "TAP EVERY TARGET";

  if(type === "avoid")
    return "TAP BLUE · AVOID RED";

  if(type === "moving")
    return "TAP THE MOVING TARGET";

  if(type === "sequence")
    return "TAP THE TARGETS IN ORDER";

  if(type === "precision")
    return "HIT THE TARGET WHEN IT APPEARS";

  return "TAP THE TARGET";

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  $("scoreValue").textContent =
    String(score);

  $("streakValue").textContent =
    String(streak);

  $("bestValue").textContent =
    String(best);

  $("levelNumber").textContent =
    "LEVEL " +
    level +
    " / " +
    TOTAL_LEVELS;


  document
    .querySelectorAll(".life")
    .forEach(
      (life,index)=>{

        life.classList.toggle(
          "off",
          index >= lives
        );

      }
    );

}


/* =========================================================
   CLEAR TIMERS
========================================================= */

function clearTimers(){

  if(timer !== null){

    clearTimeout(timer);

    timer = null;

  }


  if(animationFrame !== null){

    cancelAnimationFrame(
      animationFrame
    );

    animationFrame = null;

  }

}


/* =========================================================
   CLEAR TARGETS
========================================================= */

function clearTargets(){

  document
    .querySelectorAll(
      ".target,.sequence-dot"
    )
    .forEach(
      element=>{
        element.remove();
      }
    );

}


/* =========================================================
   RANDOM POSITION
========================================================= */

function randomPosition(){

  const arena =
    $("arena");

  const rect =
    arena.getBoundingClientRect();

  const padding = 65;

  const width =
    Math.max(
      80,
      rect.width - padding * 2
    );

  const height =
    Math.max(
      80,
      rect.height - padding * 2
    );

  return {

    x:
      padding +
      Math.random() *
      width,

    y:
      padding +
      Math.random() *
      height

  };

}


/* =========================================================
   PARTICLES
========================================================= */

function particles(x,y){

  for(let i=0;i<12;i++){

    const particle =
      document.createElement(
        "div"
      );

    particle.className =
      "particle";

    particle.style.left =
      x + "px";

    particle.style.top =
      y + "px";

    particle.style.setProperty(
      "--x",
      (
        (Math.random() - .5) *
        150
      ) + "px"
    );

    particle.style.setProperty(
      "--y",
      (
        (Math.random() - .5) *
        150
      ) + "px"
    );

    $("arena")
      .appendChild(
        particle
      );

    setTimeout(
      ()=>{
        particle.remove();
      },
      700
    );

  }

}


/* =========================================================
   FEEDBACK
========================================================= */

function showFeedback(
  text,
  good
){

  const element =
    $("feedback");

  element.textContent =
    text;

  element.className =
    "feedback show " +
    (
      good
      ? "good"
      : "bad"
    );

  setTimeout(
    ()=>{
      element.className =
        "feedback";
    },
    600
  );

}


/* =========================================================
   CREATE TARGET
========================================================= */

function createTarget(options = {}){

  const target =
    document.createElement(
      "div"
    );

  target.className =
    "target";

  if(options.small)
    target.classList.add("small");

  if(options.danger)
    target.classList.add("danger");

  const position =
    randomPosition();

  target.style.left =
    position.x + "px";

  target.style.top =
    position.y + "px";

  $("arena")
    .appendChild(
      target
    );

  return {
    element:target,
    x:position.x,
    y:position.y
  };

}


/* =========================================================
   SUCCESS
========================================================= */

function success(
  points,
  token
){

  if(
    !challengeActive ||
    token !== challengeToken
  ){
    return;
  }

  challengeActive =
    false;

  clearTimers();

  clearTargets();

  streak++;

  const multiplier =
    1 +
    Math.min(
      streak * .1,
      2
    );

  const gained =
    Math.round(
      points *
      multiplier
    );

  score += gained;

  if(score > best){

    best = score;

    try{

      localStorage.setItem(
        "brainRushBest",
        String(best)
      );

    }catch(error){}

  }

  showFeedback(
    "+" + gained,
    true
  );

  updateHUD();


  if(level >= TOTAL_LEVELS){

    timer =
      setTimeout(
        finishRun,
        600
      );

    return;

  }


  level++;

  timer =
    setTimeout(
      startLevel,
      600
    );

}


/* =========================================================
   FAILURE
========================================================= */

function fail(
  reason,
  token
){

  if(
    !challengeActive ||
    token !== challengeToken
  ){
    return;
  }

  challengeActive =
    false;

  clearTimers();

  clearTargets();

  lives--;

  streak = 0;

  showFeedback(
    reason || "MISS",
    false
  );

  updateHUD();


  if(lives <= 0){

    timer =
      setTimeout(
        gameOver,
        600
      );

    return;

  }


  level++;

  if(level > TOTAL_LEVELS){

    finishRun();

    return;

  }


  timer =
    setTimeout(
      startLevel,
      750
    );

}


/* =========================================================
   REACTION
========================================================= */

function reaction(){

  const token =
    challengeToken;

  challengeActive =
    true;

  $("instructionState")
    .textContent =
    "GO!";


  const result =
    createTarget({
      small:
        level >= 18,

      points:
        110 +
        level * 5
    });


  const timeout =
    Math.max(
      950,
      2300 -
      level * 42
    );


  result.element.addEventListener(
    "pointerdown",
    event=>{

      event.preventDefault();

      if(
        !challengeActive ||
        token !== challengeToken
      ){
        return;
      }

      particles(
        result.x,
        result.y
      );

      success(
        110 +
        level * 5,
        token
      );

    }
  );


  timer =
    setTimeout(
      ()=>{

        fail(
          "TOO SLOW",
          token
        );

      },
      timeout
    );

}


/* =========================================================
   RAPID FIRE
========================================================= */

function rapid(){

  const token =
    challengeToken;

  challengeActive =
    true;

  $("instructionState")
    .textContent =
    "GO!";


  let remaining =
    Math.min(
      2 +
      Math.floor(
        (level - 4) / 2
      ),
      5
    );


  const total =
    remaining;


  let targetTimer =
    null;


  function spawn(){

    if(
      !challengeActive ||
      token !== challengeToken
    ){
      return;
    }


    if(remaining <= 0){

      success(
        130 +
        total * 25,
        token
      );

      return;

    }


    const result =
      createTarget({
        small:
          level >= 20
      });


    const timeout =
      Math.max(
        850,
        1550 -
        level * 25
      );


    function hit(event){

      event.preventDefault();

      if(
        !challengeActive ||
        token !== challengeToken
      ){
        return;
      }

      clearTimeout(
        targetTimer
      );

      particles(
        result.x,
        result.y
      );

      result.element.remove();

      remaining--;

      if(remaining <= 0){

        success(
          130 +
          total * 25,
          token
        );

      }else{

        timer =
          setTimeout(
            spawn,
            70
          );

      }

    }


    result.element.addEventListener(
      "pointerdown",
      hit,
      {once:true}
    );


    targetTimer =
      setTimeout(
        ()=>{

          fail(
            "TOO SLOW",
            token
          );

        },
        timeout
      );

  }


  spawn();

}


/* =========================================================
   AVOID
========================================================= */

function avoid(){

  const token =
    challengeToken;

  challengeActive =
    true;

  $("instructionState")
    .textContent =
    "BLUE = GOOD · RED = BAD";


  const blue =
    createTarget({
      small:
        level >= 18
    });


  const red =
    createTarget({
      danger:true
    });


  blue.element.addEventListener(
    "pointerdown",
    event=>{

      event.preventDefault();

      if(
        !challengeActive ||
        token !== challengeToken
      ){
        return;
      }

      particles(
        blue.x,
        blue.y
      );

      success(
        140 +
        level * 4,
        token
      );

    },
    {once:true}
  );


  red.element.addEventListener(
    "pointerdown",
    event=>{

      event.preventDefault();

      if(
        !challengeActive ||
        token !== challengeToken
      ){
        return;
      }

      fail(
        "WRONG TARGET",
        token
      );

    },
    {once:true}
  );


  timer =
    setTimeout(
      ()=>{

        success(
          140 +
          level * 4,
          token
        );

      },
      Math.max(
        1300,
        2200 -
        level * 30
      )
    );

}


/* =========================================================
   MOVING TARGET
========================================================= */

function moving(){

  const token =
    challengeToken;

  challengeActive =
    true;

  $("instructionState")
    .textContent =
    "TRACK IT";


  const result =
    createTarget({
      small:
        level >= 20
    });


  result.element
    .classList
    .add("moving");


  const arena =
    $("arena");

  const rect =
    arena.getBoundingClientRect();


  const duration =
    Math.max(
      1400,
      2500 -
      level * 40
    );


  const radius =
    Math.min(
      rect.width,
      rect.height
    ) * .30;


  const start =
    performance.now();


  function animate(now){

    if(
      !challengeActive ||
      token !== challengeToken
    ){
      return;
    }


    const elapsed =
      now - start;


    const progress =
      Math.min(
        elapsed / duration,
        1
      );


    const angle =
      progress *
      Math.PI *
      (
        2 +
        level * .045
      );


    const x =
      rect.width / 2 +
      Math.cos(angle) *
      radius;


    const y =
      rect.height / 2 +
      Math.sin(angle * 1.15) *
      radius;


    result.element.style.left =
      x + "px";

    result.element.style.top =
      y + "px";


    animationFrame =
      requestAnimationFrame(
        animate
      );

  }


  result.element.addEventListener(
    "pointerdown",
    event=>{

      event.preventDefault();

      if(
        !challengeActive ||
        token !== challengeToken
      ){
        return;
      }

      particles(
        parseFloat(
          result.element.style.left
        ),
        parseFloat(
          result.element.style.top
        )
      );

      success(
        150 +
        level * 5,
        token
      );

    },
    {once:true}
  );


  animationFrame =
    requestAnimationFrame(
      animate
    );


  timer =
    setTimeout(
      ()=>{

        fail(
          "MISSED IT",
          token
        );

      },
      duration + 650
    );

}


/* =========================================================
   SEQUENCE
========================================================= */

function sequence(){

  const token =
    challengeToken;

  /*
   * The instruction has already
   * been shown during startLevel().
   *
   * Now briefly show the actual
   * sequence to memorise.
   */

  challengeActive =
    false;

  $("instructionState")
    .textContent =
    "MEMORISE THE ORDER";


  const count =
    Math.min(
      2 +
      Math.floor(
        (level - 14) / 2
      ),
      5
    );


  const dots = [];


  for(
    let i = 0;
    i < count;
    i++
  ){

    const position =
      randomPosition();


    const dot =
      document.createElement(
        "div"
      );

    dot.className =
      "sequence-dot";

    dot.textContent =
      String(i + 1);

    dot.style.left =
      position.x + "px";

    dot.style.top =
      position.y + "px";


    $("arena")
      .appendChild(
        dot
      );


    dots.push({
      element:dot,
      x:position.x,
      y:position.y,
      number:i + 1
    });

  }


  timer =
    setTimeout(
      ()=>{

        if(token !== challengeToken)
          return;


        dots.forEach(
          dot=>{
            dot.element.style.opacity =
              "0.18";
          }
        );


        let expected = 1;

        challengeActive =
          true;


        $("instructionState")
          .textContent =
          "NOW TAP 1 → 2 → 3";


        dots.forEach(
          dot=>{

            dot.element.addEventListener(
              "pointerdown",
              event=>{

                event.preventDefault();

                if(
                  !challengeActive ||
                  token !== challengeToken
                ){
                  return;
                }


                if(
                  dot.number !== expected
                ){

                  fail(
                    "WRONG ORDER",
                    token
                  );

                  return;

                }


                particles(
                  parseFloat(
                    dot.element.style.left
                  ),
                  parseFloat(
                    dot.element.style.top
                  )
                );


                dot.element.remove();

                expected++;


                if(
                  expected > count
                ){

                  success(
                    180 +
                    level * 6,
                    token
                  );

                }

              }
            );

          });


        timer =
          setTimeout(
            ()=>{

              fail(
                "TOO SLOW",
                token
              );

            },
            Math.max(
              1800,
              3200 -
              level * 35
            )
          );

      },
      850
    );

}


/* =========================================================
   PRECISION
========================================================= */

function precision(){

  const token =
    challengeToken;

  challengeActive =
    true;

  $("instructionState")
    .textContent =
    "HIT THE CORE";


  const result =
    createTarget({
      small:true
    });


  const timeout =
    Math.max(
      1000,
      2000 -
      level * 28
    );


  result.element.addEventListener(
    "pointerdown",
    event=>{

      event.preventDefault();

      if(
        !challengeActive ||
        token !== challengeToken
      ){
        return;
      }

      particles(
        result.x,
        result.y
      );

      success(
        170 +
        level * 7,
        token
      );

    },
    {once:true}
  );


  timer =
    setTimeout(
      ()=>{

        fail(
          "TOO SLOW",
          token
        );

      },
      timeout
    );

}


/* =========================================================
   START LEVEL
========================================================= */

function startLevel(){

  clearTimers();

  clearTargets();

  challengeActive =
    false;

  challengeToken++;


  const currentToken =
    challengeToken;


  const type =
    levelType(level);


  const instruction =
    instructionFor(type);


  const isNewMechanic =
    type !== lastChallengeType;


  $("levelNumber")
    .textContent =
    "LEVEL " +
    level +
    " / " +
    TOTAL_LEVELS;


  $("instructionMain")
    .textContent =
    instruction;


  $("instructionState")
    .textContent =
    isNewMechanic
      ? "READ THE RULE"
      : "GET READY";


  updateHUD();


  if(isNewMechanic){

    $("arena")
      .classList
      .add("reading");

  }else{

    $("arena")
      .classList
      .remove("reading");

  }


  /*
   * New mechanic:
   * 1 second.
   *
   * Existing mechanic:
   * 0.3 second.
   */

  const delay =
    isNewMechanic
      ? READING_TIME_NEW
      : READING_TIME_SAME;


  lastChallengeType =
    type;


  timer =
    setTimeout(
      ()=>{

        if(
          currentToken !==
          challengeToken
        ){
          return;
        }


        $("arena")
          .classList
          .remove("reading");


        $("instructionState")
          .textContent =
          "GO!";


        /*
         * IMPORTANT:
         *
         * The actual challenge
         * begins HERE.
         *
         * Therefore the reading
         * period never counts.
         */

        if(type === "reaction"){

          reaction();

        }

        else if(type === "rapid"){

          rapid();

        }

        else if(type === "avoid"){

          avoid();

        }

        else if(type === "moving"){

          moving();

        }

        else if(type === "sequence"){

          sequence();

        }

        else{

          precision();

        }

      },
      delay
    );

}


/* =========================================================
   COUNTDOWN
========================================================= */

function countdown(done){

  const overlay =
    $("countdown");

  const number =
    $("countdownNumber");


  overlay
    .classList
    .add("show");


  let current = 3;


  function tick(){

    if(current === 0){

      number.textContent =
        "GO!";


      setTimeout(
        ()=>{

          overlay
            .classList
            .remove("show");

          done();

        },
        400
      );


      return;

    }


    number.textContent =
      String(current);


    number.style.animation =
      "none";


    void number.offsetWidth;


    number.style.animation =
      "countPop .75s ease-out";


    current--;


    setTimeout(
      tick,
      700
    );

  }


  tick();

}


/* =========================================================
   START RUN
========================================================= */

function startRun(){

  if(runStarting)
    return;


  runStarting =
    true;


  clearTimers();

  clearTargets();


  challengeActive =
    false;


  lastChallengeType =
    null;


  challengeToken++;


  level = 1;

  score = 0;

  streak = 0;

  lives = 3;


  $("overlay")
    .classList
    .remove("show");


  $("homeScreen")
    .classList
    .remove("active");


  $("gameScreen")
    .classList
    .add("active");


  updateHUD();


  $("instructionMain")
    .textContent =
    "GET READY";


  $("instructionState")
    .textContent =
    "PREPARE YOUR BRAIN";


  countdown(
    ()=>{

      runStarting =
        false;

      startLevel();

    }
  );

}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

  clearTimers();

  clearTargets();

  challengeActive =
    false;


  $("overlayTitle")
    .textContent =
    "RUN OVER";


  $("overlaySub")
    .textContent =
    "You reached level " +
    level +
    ". Build your streak and try again.";


  $("overlayScore")
    .textContent =
    String(score);


  $("overlay")
    .classList
    .add("show");

}


/* =========================================================
   FINISH
========================================================= */

function finishRun(){

  clearTimers();

  clearTargets();

  challengeActive =
    false;


  $("overlayTitle")
    .textContent =
    "BRAIN RUSH COMPLETE";


  $("overlaySub")
    .textContent =
    "30 levels survived. Your brain is officially warmed up.";


  $("overlayScore")
    .textContent =
    String(score);


  $("overlay")
    .classList
    .add("show");

}


/* =========================================================
   QUIT
========================================================= */

function quitRun(){

  clearTimers();

  clearTargets();


  challengeActive =
    false;

  runStarting =
    false;


  challengeToken++;


  $("countdown")
    .classList
    .remove("show");


  $("overlay")
    .classList
    .remove("show");


  $("gameScreen")
    .classList
    .remove("active");


  $("homeScreen")
    .classList
    .add("active");


  lastChallengeType =
    null;

}


/* =========================================================
   BUTTONS
========================================================= */

$("speedMode")
  .addEventListener(
    "click",
    startRun
  );


$("startBtn")
  .addEventListener(
    "click",
    startRun
  );


$("againBtn")
  .addEventListener(
    "click",
    startRun
  );


$("quitBtn")
  .addEventListener(
    "click",
    quitRun
  );


/* =========================================================
   VISIBILITY SAFETY
========================================================= */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(
      document.hidden &&
      $("gameScreen")
        .classList
        .contains("active")
    ){

      clearTimers();

      clearTargets();

      challengeActive =
        false;

      challengeToken++;

    }

  }
);


/* =========================================================
   INITIALISE
========================================================= */

updateHUD();

</script>

</div>

</body>
</html>
